name: Build APK

# 最小权限：checkout 读代码即可；产物上传不需要额外权限
permissions:
  contents: read

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 完整历史 + tags：版本号自动化需要 git describe / rev-list 能看到 tag
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # 增量构建：缓存 Gradle 发行版与全部依赖下载，
      # 后续构建不再重复下载几百 MB，Chaquopy 打包仍每次执行。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # 固定签名：debug keystore 每次 CI 都是新的，会导致用户无法覆盖安装；
      # release 构建改用仓库 Secrets 里的固定 keystore。
      # 桥接一致性检查：JS 调 bridge().xxx() 必须在 Java 有 @JavascriptInterface
      # 方法，Java callAttr("yyy") 必须在 Python 有对应函数。防 v0.22.0 漏 Java 层。
      - name: Check bridge consistency
        run: |
          python3 - <<'EOF'
          import re
          js = open("app/src/main/assets/admin/index.html", encoding="utf-8").read()
          java = open("app/src/main/java/com/mssg/app/ApiBridge.java", encoding="utf-8").read()
          py = open("app/src/main/python/mssg_api.py", encoding="utf-8").read()
          js_calls = set(re.findall(r'bridge\(\)\.(\w+)\(', js))
          java_methods = set(re.findall(r'public (?:String|void|boolean|int) (\w+)\(', java))
          py_calls = set(re.findall(r'callAttr\("(\w+)"', java))
          py_defs = set(re.findall(r'^def (\w+)\(', py, re.M))
          missing = (js_calls - java_methods) | (py_calls - py_defs)
          assert not missing, f"桥接缺失: {missing}"
          print(f"桥接一致: JS {len(js_calls)} / Java {len(java_methods)} / Python {len(py_defs)}")
          EOF

      # JS 顶层 TDZ 检查：const/let 在声明前被顶层语句直接引用会导致整个
      # script 报 ReferenceError 后续代码全不执行（node --check 查不出，只能运行时发现）。
      # 曾真实踩坑：if(SELF_UPDATE) 写在 const SELF_UPDATE 声明之前，App 点什么都没反应。
      - name: Check JS top-level TDZ
        run: |
          python3 - <<'EOF'
          import re
          html = open("app/src/main/assets/admin/index.html", encoding="utf-8").read()
          js = re.findall(r'<script>(.*?)</script>', html, re.S)[0]
          js = re.sub(r'/\*.*?\*/', '', js, flags=re.S)
          def strip(line):
              line = re.sub(r'"(?:[^"\\]|\\.)*"', '""', line)
              line = re.sub(r"'(?:[^'\\]|\\.)*'", "''", line)
              line = re.sub(r'`(?:[^`\\]|\\.)*`', '``', line)
              line = re.sub(r'//.*', '', line)
              return line
          lines = js.split('\n')
          code_lines, depths = [], []
          depth = 0
          for ln in lines:
              c = strip(ln)
              code_lines.append(c); depths.append(depth)
              depth += c.count('{') - c.count('}')
          decls = {}
          for i, c in enumerate(code_lines):
              m = re.match(r'^(?:const|let)\s+([$\w]+)\s*=', c)
              if m and depths[i] == 0:
                  decls[m.group(1)] = i
          bad = []
          for name, dline in decls.items():
              pat = re.compile(r'(?<![\w$])' + re.escape(name) + r'(?![\w$])')
              for i in range(dline):
                  if depths[i] != 0:
                      continue
                  for m in pat.finditer(code_lines[i]):
                      if '{' in code_lines[i][:m.start()]:
                          continue  # 同行 { 之后：函数体/回调内，延迟执行，安全
                      bad.append((name, dline+1, i+1, code_lines[i].strip()[:70]))
                      break
                  else:
                      continue
                  break
          assert not bad, "JS 顶层 TDZ 错误: %s" % bad
          print(f"TDZ 检查通过: {len(decls)} 个顶层 const/let")
          EOF

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > /tmp/mssg-release.keystore

      - name: Build release APK
        env:
          MSSG_KEYSTORE_PATH: /tmp/mssg-release.keystore
          MSSG_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MSSG_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MSSG_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          # 版本号手写在 app/build.gradle；这里只做校验：tag 的版本必须与
          # build.gradle 的 versionName 一致，否则直接失败，防止发版时忘改。
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.27.0")
          VER=${TAG#v}
          GVER=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          GCODE=$(grep -oP 'versionCode \K[0-9]+' app/build.gradle | head -1)
          if [ "$VER" != "$GVER" ]; then
            echo "ERROR: git tag ($VER) != build.gradle versionName ($GVER)，发版前请先同步"
            exit 1
          fi
          echo "Building versionName=$GVER versionCode=$GCODE (tag $TAG, verified match)"
          gradle assembleRelease --console=plain
          gradle assembleDebug --console=plain

      - name: Upload APK (github flavor)
        uses: actions/upload-artifact@v4
        with:
          name: mssg-apk
          path: app/build/outputs/apk/github/release/app-github-release.apk

      - name: Upload APK (fdroid flavor)
        uses: actions/upload-artifact@v4
        with:
          name: mssg-apk-fdroid
          path: app/build/outputs/apk/fdroid/release/app-fdroid-release.apk

      - name: Upload APK (github flavor, debug)
        uses: actions/upload-artifact@v4
        with:
          name: mssg-apk-debug
          path: app/build/outputs/apk/github/debug/app-github-debug.apk

      - name: Upload APK (fdroid flavor, debug)
        uses: actions/upload-artifact@v4
        with:
          name: mssg-apk-fdroid-debug
          path: app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk
