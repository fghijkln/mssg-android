name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # 增量构建：缓存 Gradle 发行版与全部依赖下载，
      # 后续构建不再重复下载几百 MB，Chaquopy 打包仍每次执行。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # 固定签名：debug keystore 每次 CI 都是新的，会导致用户无法覆盖安装；
      # release 构建改用仓库 Secrets 里的固定 keystore。
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > /tmp/mssg-release.keystore

      - name: Build release APK
        env:
          MSSG_KEYSTORE_PATH: /tmp/mssg-release.keystore
          MSSG_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MSSG_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MSSG_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          gradle assembleRelease --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mssg-apk
          path: app/build/outputs/apk/release/app-release.apk
