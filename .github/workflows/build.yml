name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 完整历史 + tags：版本号自动化需要 git describe / rev-list 能看到 tag
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # 增量构建：缓存 Gradle 发行版与全部依赖下载，
      # 后续构建不再重复下载几百 MB，Chaquopy 打包仍每次执行。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # 固定签名：debug keystore 每次 CI 都是新的，会导致用户无法覆盖安装；
      # release 构建改用仓库 Secrets 里的固定 keystore。
      # 桥接一致性检查：JS 调 bridge().xxx() 必须在 Java 有 @JavascriptInterface
      # 方法，Java callAttr("yyy") 必须在 Python 有对应函数。防 v0.22.0 漏 Java 层。
      - name: Check bridge consistency
        run: |
          python3 - <<'EOF'
          import re
          js = open("app/src/main/assets/admin/index.html", encoding="utf-8").read()
          java = open("app/src/main/java/com/mssg/app/ApiBridge.java", encoding="utf-8").read()
          py = open("app/src/main/python/mssg_api.py", encoding="utf-8").read()
          js_calls = set(re.findall(r'bridge\(\)\.(\w+)\(', js))
          java_methods = set(re.findall(r'public (?:String|void) (\w+)\(', java))
          py_calls = set(re.findall(r'callAttr\("(\w+)"', java))
          py_defs = set(re.findall(r'^def (\w+)\(', py, re.M))
          missing = (js_calls - java_methods) | (py_calls - py_defs)
          assert not missing, f"桥接缺失: {missing}"
          print(f"桥接一致: JS {len(js_calls)} / Java {len(java_methods)} / Python {len(py_defs)}")
          EOF

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > /tmp/mssg-release.keystore

      - name: Build release APK
        env:
          MSSG_KEYSTORE_PATH: /tmp/mssg-release.keystore
          MSSG_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MSSG_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MSSG_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          # 版本号自动化：versionName 取最新 git tag（去 v 前缀），versionCode 取 commit 总数；
          # 发版时打 tag 再 push，CI 自动对齐，再也不会出现“release 是新 tag、APK 里是旧版本”的问题。
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.27.0")
          VER=${TAG#v}
          CODE=$(git rev-list --count HEAD)
          echo "Building versionName=$VER versionCode=$CODE (tag $TAG)"
          gradle assembleRelease --console=plain -PappVersionName="$VER" -PappVersionCode="$CODE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mssg-apk
          path: app/build/outputs/apk/release/app-release.apk
