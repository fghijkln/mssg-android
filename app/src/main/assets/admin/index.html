<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>mssg</title>
<style>
:root{
  --primary:#4f46e5; --primary-dark:#4338ca;
  --bg:#f4f5f7; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
  --danger:#dc2626; --ok:#059669;
  --radius:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:16px; min-height:100vh;}
/* 顶栏 */
.appbar{position:sticky;top:0;z-index:10;background:var(--primary);color:#fff;
  padding:14px 16px calc(14px + env(safe-area-inset-top)) ;
  padding-top:calc(14px + env(safe-area-inset-top));
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 8px rgba(0,0,0,.15);}
.appbar h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.5px;}
.appbar .actions{display:flex;gap:8px;}
.btn{border:none;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600;
  cursor:pointer;background:var(--primary);color:#fff;}
.btn:active{opacity:.85;}
.btn.ghost{background:rgba(255,255,255,.18);color:#fff;padding:8px 14px;font-size:14px;}
.btn.secondary{background:#e5e7eb;color:var(--text);}
.btn.danger-btn{background:#fee2e2;color:var(--danger);}
.btn.block{width:100%;padding:14px;font-size:16px;}
/* 列表 */
.list{padding:16px 14px 96px;max-width:640px;margin:0 auto;}
.card{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;align-items:center;gap:10px;}
.card .info{flex:1;min-width:0;}
.card .title{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card .meta{color:var(--muted);font-size:13px;margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.badge{font-size:12px;background:#eef2ff;color:var(--primary);border-radius:6px;padding:2px 8px;}
.badge.draft{background:#fef3c7;color:#b45309;}
.icon-btn{border:none;background:#f3f4f6;border-radius:10px;width:44px;height:44px;font-size:18px;cursor:pointer;flex-shrink:0;}
.icon-btn.danger{background:#fee2e2;}
.empty{text-align:center;color:var(--muted);padding:60px 20px;line-height:1.8;}
/* FAB */
.fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));z-index:10;
  width:60px;height:60px;border-radius:50%;border:none;background:var(--primary);color:#fff;
  font-size:30px;line-height:1;box-shadow:0 4px 14px rgba(79,70,229,.4);cursor:pointer;}
.fab:active{transform:scale(.94);}
/* 编辑器 */
.editor{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;}
.editor.open{display:flex;}
.editor-bar{display:flex;align-items:center;gap:10px;background:var(--primary);color:#fff;
  padding:12px 12px;padding-top:calc(12px + env(safe-area-inset-top));}
.editor-bar h2{margin:0;font-size:17px;flex:1;}
.editor-bar .btn.ghost{padding:8px 14px;}
.editor-body{flex:1;overflow-y:auto;padding:16px 14px;max-width:640px;width:100%;margin:0 auto;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;}
.field input[type=text],.field input[type=date],.field textarea{
  width:100%;border:1px solid #d1d5db;border-radius:10px;padding:12px;font-size:16px;background:#fff;}
.field textarea{min-height:300px;font-family:ui-monospace,Menlo,monospace;line-height:1.6;resize:vertical;}
.row2{display:flex;gap:12px;}
.row2 .field{flex:1;}
.check{display:flex;align-items:center;gap:10px;font-size:15px;padding:4px 0;}
.check input{width:22px;height:22px;accent-color:var(--primary);}
/* toast + loading */
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:#1f2937;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;max-width:86vw;
  opacity:0;transition:all .25s;z-index:50;pointer-events:none;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.loading{position:fixed;inset:0;z-index:40;background:rgba(255,255,255,.7);display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--muted);}
.loading.show{display:flex;}
.spinner{width:40px;height:40px;border:4px solid #e5e7eb;border-top-color:var(--primary);border-radius:50%;
  animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
/* 主题选择 */
.sheet-backdrop{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:none;
  align-items:flex-end;justify-content:center;}
.sheet-backdrop.show{display:flex;}
.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:640px;
  padding:20px 18px calc(24px + env(safe-area-inset-bottom));}
.sheet h3{margin:0 0 14px;font-size:17px;}
.theme-opt{display:flex;align-items:center;gap:12px;width:100%;border:1px solid #e5e7eb;
  background:#fff;border-radius:12px;padding:14px 16px;font-size:16px;margin-bottom:10px;cursor:pointer;text-align:left;}
.theme-opt .dot{width:22px;height:22px;border-radius:50%;flex-shrink:0;border:1px solid #d1d5db;}
.theme-opt.current{border-color:var(--primary);background:#eef2ff;}
.theme-opt .check{margin-left:auto;color:var(--primary);font-weight:700;}
</style>
</head>
<body>

<div class="appbar">
  <h1>mssg</h1>
  <div class="actions">
    <button class="btn ghost" onclick="openThemes()">🎨</button>
    <button class="btn ghost" onclick="openExport()">导出</button>
    <button class="btn ghost" onclick="doPreview()">预览</button>
    <button class="btn ghost" onclick="doBuild()">构建</button>
  </div>
</div>

<div class="list" id="list"></div>

<button class="fab" onclick="openEditor()" aria-label="新建">＋</button>

<div class="editor" id="editor">
  <div class="editor-bar">
    <button class="btn ghost" onclick="closeEditor()">‹ 返回</button>
    <h2 id="editorTitle">新建文章</h2>
    <button class="btn ghost" onclick="doSharePage()">分享</button>
    <button class="btn ghost" onclick="doSave()">保存</button>
  </div>
  <div class="editor-body">
    <div class="field">
      <label>标题</label>
      <input type="text" id="f_title" placeholder="文章标题">
    </div>
    <div class="row2">
      <div class="field">
        <label>文件名（content/ 下相对路径）</label>
        <input type="text" id="f_rel" placeholder="post/hello.md">
      </div>
      <div class="field">
        <label>日期</label>
        <input type="date" id="f_date">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>标签（逗号分隔）</label>
        <input type="text" id="f_tags" placeholder="生活, 随笔">
      </div>
      <div class="field">
        <label>分类（逗号分隔）</label>
        <input type="text" id="f_categories" placeholder="">
      </div>
    </div>
    <div class="field">
      <label class="check"><input type="checkbox" id="f_draft"> 草稿（不发布）</label>
    </div>
    <div class="field">
      <label>正文（Markdown）</label>
      <textarea id="f_body" placeholder="# 标题&#10;&#10;正文…"></textarea>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="loading" id="loading"><div class="spinner"></div><div>处理中…</div></div>

<div class="editor" id="cssEditor">
  <div class="editor-bar">
    <button class="btn ghost" onclick="closeCssEditor()">‹ 返回</button>
    <h2>自定义 CSS</h2>
    <button class="btn ghost" onclick="clearCss()">恢复默认</button>
    <button class="btn ghost" onclick="saveCss()">应用</button>
  </div>
  <div class="editor-body">
    <div class="field">
      <label id="cssHint">在当前主题样式基础上改，点"应用"实时生效</label>
      <textarea id="f_css" style="min-height:60vh" spellcheck="false"></textarea>
    </div>
  </div>
</div>

<div class="sheet-backdrop" id="themeSheet" onclick="if(event.target===this)closeThemes()">
  <div class="sheet">
    <h3>选择主题</h3>
    <div id="themeList"></div>
    <button class="theme-opt" onclick="closeThemes();openCssEditor()">
      <span>✏️</span><span>自定义 CSS<span id="cssBadge"></span><br><small style="color:var(--muted)">随意改样式，实时预览</small></span>
    </button>
  </div>
</div>

<div class="sheet-backdrop" id="exportSheet" onclick="if(event.target===this)closeExport()">
  <div class="sheet">
    <h3>导出整站</h3>
    <div id="buildInfo" style="font-size:13px;color:var(--muted);margin:0 4px 8px"></div>
    <button class="theme-opt" onclick="doExportZip(true)">
      <span>💾</span><span>保存 ZIP 到下载<br><small style="color:var(--muted)">用于上传到 Cloudflare Pages / Netlify</small></span>
    </button>
    <button class="theme-opt" onclick="doExportZip(false)">
      <span>📤</span><span>分享 ZIP<br><small style="color:var(--muted)">通过微信 / 邮件 / 云盘发送</small></span>
    </button>
    <button class="theme-opt" onclick="openCf()">
      <span>☁️</span><span>部署到 Cloudflare Pages<br><small style="color:var(--muted)">连接账号后一键上线（可选）</small></span>
    </button>
    <button class="theme-opt" onclick="doCleanBuild()">
      <span>🧹</span><span>清除构建产物<br><small style="color:var(--muted)">删除 public/，文章和配置不受影响</small></span>
    </button>
    <button class="theme-opt" onclick="doBackupSite()">
      <span>🗄️</span><span>备份站点源码<br><small style="color:var(--muted)">打包文章/配置/模板，不含 Token，发到微信/云盘/邮箱</small></span>
    </button>
  </div>
</div>

<div class="sheet-backdrop" id="cfSheet" onclick="if(event.target===this)closeCf()">
  <div class="sheet">
    <h3>☁️ Cloudflare Pages</h3>
    <div id="cfBody"></div>
  </div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const bridge = () => window.MssgApi;
let editingRel = null;

function toast(msg, ms=2600){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove("show"), ms);
}
function loading(show){ $("loading").classList.toggle("show", !!show); }
/* 让出一次绘制机会，避免同步桥调用卡住时 loading 画不出来 */
function withLoading(fn){
  loading(true);
  setTimeout(()=>{ try{ fn(); } finally{ loading(false); } }, 60);
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,
    c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function refresh(){
  let r;
  try{ r = JSON.parse(bridge().listPages()); }
  catch(e){ toast("引擎未就绪："+e); return; }
  if(!r.ok){ toast(r.msg); return; }
  const pages = r.pages || [];
  const el = $("list");
  if(!pages.length){
    el.innerHTML = '<div class="empty">还没有文章<br>点右下角 ＋ 写第一篇吧</div>';
    return;
  }
  el.innerHTML = pages.map(p=>{
    const badges = `<span class="badge">${esc(p.lang||"")}</span>` +
      (p.draft ? ' <span class="badge draft">草稿</span>' : '');
    return `<div class="card" onclick="openEditor('${esc(p.rel)}')">
      <div class="info">
        <div class="title">${esc(p.title)}</div>
        <div class="meta"><span>${esc(p.date||"")}</span>${badges}</div>
      </div>
      <button class="icon-btn danger" onclick="event.stopPropagation();doDelete('${esc(p.rel)}','${esc(p.title)}')">🗑</button>
    </div>`;
  }).join("");
}

function openEditor(rel){
  editingRel = rel || null;
  $("editorTitle").textContent = rel ? "编辑文章" : "新建文章";
  if(rel){
    let r;
    try{ r = JSON.parse(bridge().getPage(rel)); }
    catch(e){ toast("读取失败："+e); return; }
    if(!r.ok){ toast(r.msg); return; }
    const m = r.meta || {};
    $("f_rel").value = rel;
    $("f_rel").disabled = true;
    $("f_title").value = m.title || "";
    $("f_date").value = m.date || "";
    $("f_tags").value = (m.tags||[]).join(", ");
    $("f_categories").value = (m.categories||[]).join(", ");
    $("f_draft").checked = !!m.draft;
    $("f_body").value = r.body || "";
  }else{
    $("f_rel").value = "post/";
    $("f_rel").disabled = false;
    $("f_title").value = "";
    $("f_date").value = new Date().toISOString().slice(0,10);
    $("f_tags").value = "";
    $("f_categories").value = "";
    $("f_draft").checked = false;
    $("f_body").value = "";
  }
  $("editor").classList.add("open");
}
function closeEditor(){ $("editor").classList.remove("open"); }

function doSave(){
  const rel = $("f_rel").value.trim();
  const title = $("f_title").value.trim();
  if(!rel || !title){ toast("标题和文件名不能为空"); return; }
  withLoading(()=>{
    let r;
    try{
      r = JSON.parse(bridge().savePage(
        rel, title, $("f_date").value.trim(),
        $("f_tags").value, $("f_categories").value,
        $("f_draft").checked, $("f_body").value));
    }catch(e){ toast("保存失败："+e); return; }
    toast(r.ok ? ("已保存，" + (r.msg||"")) : r.msg);
    if(r.ok){ closeEditor(); refresh(); }
  });
}

function doDelete(rel, title){
  if(!confirm("删除「"+title+"」？")) return;
  withLoading(()=>{
    let r;
    try{ r = JSON.parse(bridge().deletePage(rel)); }
    catch(e){ toast("删除失败："+e); return; }
    toast(r.ok ? ("已删除，" + (r.msg||"")) : r.msg);
    if(r.ok) refresh();
  });
}

function doBuild(){
  withLoading(()=>{
    let r;
    try{ r = JSON.parse(bridge().buildSite()); }
    catch(e){ toast("构建失败："+e); return; }
    toast(r.ok ? r.msg : r.msg);
  });
}

function doPreview(){
  withLoading(()=>{
    let r;
    try{ r = JSON.parse(bridge().buildSite()); }
    catch(e){ toast("构建失败："+e); return; }
    if(!r.ok){ toast(r.msg); return; }
    bridge().previewSite();
  });
}

/* 主题 */
const THEME_DOTS = {company:"#1d4ed8", minimal:"#9ca3af", novacore:"#0a0f22"};
function openThemes(){
  let r;
  try{ r = JSON.parse(bridge().listThemes()); }
  catch(e){ toast("读取主题失败："+e); return; }
  if(!r.ok){ toast(r.msg); return; }
  let cur = null;
  try{ cur = JSON.parse(bridge().getTheme()).theme; }catch(e){}
  $("themeList").innerHTML = (r.themes||[]).map(t=>{
    const dot = THEME_DOTS[t.id] || "#6b7280";
    return `<button class="theme-opt${t.id===cur?" current":""}" onclick="pickTheme('${esc(t.id)}')">
      <span class="dot" style="background:${dot}"></span>
      <span>${esc(t.name)}</span>
      ${t.id===cur?'<span class="check">✓</span>':""}
    </button>`;
  }).join("");
  try{
    const c = JSON.parse(bridge().getCustomCss());
    $("cssBadge").textContent = c.is_custom ? "（使用中）" : "";
  }catch(e){}
  $("themeSheet").classList.add("show");
}
function closeThemes(){ $("themeSheet").classList.remove("show"); }
function pickTheme(id){
  closeThemes();
  withLoading(()=>{
    let r;
    try{ r = JSON.parse(bridge().setTheme(id)); }
    catch(e){ toast("切换失败："+e); return; }
    toast(r.ok ? ("已切换，" + (r.msg||"")) : r.msg);
  });
}

/* 导出 */
function openExport(){
  try{
    const r = JSON.parse(bridge().getBuildInfo());
    $("buildInfo").textContent = (r.ok && r.exists)
      ? ("构建产物：" + r.files + " 个文件，共 " + r.size_human)
      : "还没有构建产物";
  }catch(e){ $("buildInfo").textContent = ""; }
  $("exportSheet").classList.add("show");
}
function doCleanBuild(){
  if(!confirm("删除构建产物（public/）？文章、配置、主题不受影响。")) return;
  closeExport();
  withLoading(()=>{
    let r;
    try{ r = JSON.parse(bridge().cleanBuild()); }
    catch(e){ toast("清除失败："+e); return; }
    toast(r.ok ? "已清除构建产物" : r.msg);
  });
}
function closeExport(){ $("exportSheet").classList.remove("show"); }
function doBackupSite(){
  closeExport();
  withLoading(()=>{
    let r;
    try{ r = JSON.parse(bridge().backupSite()); }
    catch(e){ toast("备份失败："+e); return; }
    if(!r.ok){ toast(r.msg); return; }
    bridge().shareFile(r.path, r.name || "mssg-backup.zip", "application/zip");
    toast("正在打开分享…把备份发给自己（文件传输助手/云盘/邮箱）", 3600);
  });
}
function doExportZip(save){
  closeExport();
  withLoading(()=>{
    let r;
    try{ r = JSON.parse(bridge().exportZip()); }
    catch(e){ toast("导出失败："+e); return; }
    if(!r.ok){ toast(r.msg); return; }
    if(save){
      let s;
      try{ s = JSON.parse(bridge().saveToDownload(r.path, "mssg-site.zip", "application/zip")); }
      catch(e){ toast("保存失败："+e); return; }
      toast(s.ok ? ("已保存到" + s.msg) : s.msg, 3200);
    }else{
      bridge().shareFile(r.path, "mssg-site.zip", "application/zip");
      toast("正在打开分享…");
    }
  });
}
/* Cloudflare 一键部署（可选） */
var cfView = "deploy";
function openCf(){ closeExport(); cfView = "deploy"; renderCf(); $("cfSheet").classList.add("show"); }
function closeCf(){ $("cfSheet").classList.remove("show"); }
function cfCall(fn){
  try{ return JSON.parse(bridge()[fn].apply(bridge(), Array.prototype.slice.call(arguments,1))); }
  catch(e){ return {ok:false, msg:"调用失败："+e}; }
}
function renderCf(){
  const st = cfCall("cfStatus");
  const b = $("cfBody");
  if(!st.ok){ b.innerHTML = "<p>读取状态失败："+st.msg+"</p>"; return; }
  if(!st.connected){
    b.innerHTML =
      '<p style="color:var(--muted);font-size:13px">连接你的 Cloudflare 账号，之后点一下就能把网站部署上线，不用再手动导 ZIP 传文件。</p>'+
      '<input id="cfToken" type="password" placeholder="粘贴 API Token" style="width:100%;box-sizing:border-box;margin:8px 0;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)">'+
      '<button class="theme-opt" onclick="doCfConnect()"><span>🔑</span><span>连接</span></button>'+
      '<p style="color:var(--muted);font-size:12px">去 dash.cloudflare.com → 右上角头像 → 我的个人资料 → API 令牌 → 创建令牌 → 自定义令牌，权限选 <b>Cloudflare Pages / 编辑</b>。Token 只保存在本机。</p>';
  }else if(!st.account_id){
    b.innerHTML =
      '<p style="font-size:13px">Token 有效，但没能自动读到账号，请手动填 <b>Account ID</b>。</p>'+
      '<input id="cfAccountId" type="text" placeholder="粘贴 Account ID" style="width:100%;box-sizing:border-box;margin:8px 0;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)">'+
      '<button class="theme-opt" onclick="doCfSetAccount()"><span>🆔</span><span>保存</span></button>'+
      '<p style="color:var(--muted);font-size:12px">在浏览器打开 dash.cloudflare.com，地址栏里 <b>dash.cloudflare.com/ 后面那串字符</b>就是 Account ID。</p>'+
      '<button class="theme-opt" onclick="doCfDisconnect()"><span>🔌</span><span>断开连接</span></button>';
  }else if(cfView==="projects" || !st.project){
    renderCfProjects(st);
  }else{
    b.innerHTML =
      '<p style="font-size:13px">已连接：'+st.account_name+'<br>项目：<b>'+st.project+'</b><br><small style="color:var(--muted)">https://'+st.project+'.pages.dev</small></p>'+
      '<button class="theme-opt" onclick="doCfDeploy()"><span>☁️</span><span>一键部署<br><small style="color:var(--muted)">构建并上传，可能需要半分钟</small></span></button>'+
      '<button class="theme-opt" onclick="cfShowProjects()"><span>🔀</span><span>切换项目</span></button>'+
      '<button class="theme-opt" onclick="doCfDisconnect()"><span>🔌</span><span>断开连接</span></button>';
  }
}
function cfShowProjects(){ cfView = "projects"; renderCf(); }
function cfBackToDeploy(){ cfView = "deploy"; renderCf(); }
function cfEsc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function cfStatusBadge(latest){
  if(!latest) return "⚪ 未部署";
  const d = (latest.created_on||"").slice(0,10);
  const when = d ? " "+d : "";
  if(latest.status==="success") return "✅ 已上线"+when;
  if(latest.status==="failure") return "❌ 部署失败"+when;
  return "🔨 "+cfEsc(latest.stage||"部署中")+when;
}
function renderCfProjects(st){
  const b = $("cfBody");
  b.innerHTML =
    '<p style="font-size:13px">选择要部署的 Pages 项目</p>'+
    '<div id="cfProjList"><p style="color:var(--muted);font-size:13px">加载中…</p></div>'+
    '<input id="cfProject" type="text" placeholder="新项目名，如 my-site" style="width:100%;box-sizing:border-box;margin:8px 0;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)">'+
    '<button class="theme-opt" onclick="doCfSetProject()"><span>🚀</span><span>创建并使用该项目</span></button>'+
    (st.project ? '<button class="theme-opt" onclick="cfBackToDeploy()"><span>↩️</span><span>返回</span></button>' : "")+
    '<button class="theme-opt" onclick="doCfDisconnect()"><span>🔌</span><span>断开连接</span></button>';
  withLoading(()=>{
    const r = cfCall("cfProjects");
    const box = $("cfProjList");
    if(!box) return;
    if(!r.ok){ box.innerHTML = "<p style='font-size:13px'>加载失败："+cfEsc(r.msg)+"</p>"; return; }
    const list = r.projects || [];
    if(!list.length){ box.innerHTML = '<p style="color:var(--muted);font-size:13px">还没有项目，在下面创建一个。</p>'; return; }
    box.innerHTML = list.map(p=>{
      const cur = (p.name===r.current) ? ' <small style="color:var(--acc)">● 当前</small>' : "";
      return '<button class="theme-opt" onclick="doCfUseProject(\''+p.name.replace(/\\/g,"\\\\").replace(/\'/g,"\\\'")+'\')">'+
        '<span>📄</span><span style="text-align:left;flex:1">'+cfEsc(p.name)+cur+
        '<br><small style="color:var(--muted)">'+cfEsc(p.url)+' · '+cfStatusBadge(p.latest)+'</small></span></button>';
    }).join("");
  });
}
function doCfUseProject(name){
  withLoading(()=>{
    const r = cfCall("cfSetProject", name);
    if(!r.ok){ toast(r.msg, 3200); return; }
    cfView = "deploy";
    toast("已切换到项目："+name, 2200);
    renderCf();
  });
}
function doCfConnect(){
  const token = $("cfToken").value.trim();
  if(!token){ toast("请先粘贴 API Token"); return; }
  withLoading(()=>{
    const r = cfCall("cfConnect", token);
    toast(r.ok ? ("已连接："+r.account_name) : r.msg, 3000);
    renderCf();
  });
}
function doCfSetAccount(){
  const id = $("cfAccountId").value.trim();
  if(!id){ toast("请先粘贴 Account ID"); return; }
  withLoading(()=>{
    const r = cfCall("cfSetAccount", id);
    toast(r.ok ? "账号已设置" : r.msg, 3200);
    renderCf();
  });
}
function doCfSetProject(){
  const name = $("cfProject").value.trim() || "mssg-site";
  withLoading(()=>{
    const r = cfCall("cfSetProject", name);
    if(!r.ok){ toast(r.msg, 3200); return; }
    cfView = "deploy";
    toast("项目就绪："+r.url, 3200);
    renderCf();
  });
}
function doCfDeploy(){
  withLoading(()=>{
    const r = cfCall("cfDeploy");
    if(!r.ok){ toast(r.msg, 4000); return; }
    $("cfBody").innerHTML =
      '<p style="font-size:15px">🎉 部署成功！</p>'+
      '<p><a href="'+r.project_url+'" target="_blank" style="color:var(--acc)">'+r.project_url+'</a></p>'+
      '<button class="theme-opt" onclick="closeCf()"><span>✅</span><span>完成</span></button>';
    toast("已上线", 2600);
  });
}
function doCfDisconnect(){
  const r = cfCall("cfDisconnect");
  toast(r.ok ? "已断开" : r.msg);
  renderCf();
}
function doSharePage(){
  const rel = $("f_rel").value.trim();
  if(!rel){ toast("没有可分享的页面"); return; }
  withLoading(()=>{
    let r;
    try{ r = JSON.parse(bridge().exportPageHtml(rel)); }
    catch(e){ toast("导出失败："+e); return; }
    if(!r.ok){ toast(r.msg); return; }
    bridge().shareFile(r.path, r.name || "page.html", "text/html");
    toast("正在打开分享…");
  });
}

/* 自定义 CSS */
function openCssEditor(){
  let r;
  try{ r = JSON.parse(bridge().getCustomCss()); }
  catch(e){ toast("读取失败："+e); return; }
  if(!r.ok){ toast(r.msg); return; }
  $("f_css").value = r.css || "";
  $("cssHint").textContent = r.is_custom
    ? "正在覆盖主题样式，点“应用”实时生效"
    : "以当前主题样式为起点改，点“应用”实时生效";
  $("cssEditor").classList.add("open");
}
function closeCssEditor(){ $("cssEditor").classList.remove("open"); }
function saveCss(){
  withLoading(()=>{
    let r;
    try{ r = JSON.parse(bridge().saveCustomCss($("f_css").value)); }
    catch(e){ toast("应用失败："+e); return; }
    toast(r.ok ? ("已应用，" + (r.msg||"")) : r.msg);
  });
}
function clearCss(){
  if(!confirm("清除自定义 CSS，恢复主题默认样式？")) return;
  withLoading(()=>{
    let r;
    try{ r = JSON.parse(bridge().clearCustomCss()); }
    catch(e){ toast("清除失败："+e); return; }
    if(r.ok){ toast("已恢复默认"); openCssEditor(); }
    else toast(r.msg);
  });
}

document.addEventListener("DOMContentLoaded", refresh);
</script>
</body>
</html>
