<!doctype html>
<html lang="zh" id="htmlRoot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title data-i18n="app.name">WebWeave</title>
<style>
:root{
  --primary:#4f46e5; --primary-dark:#4338ca;
  --bg:#f4f5f7; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
  --danger:#dc2626; --ok:#059669;
  --input-bg:#ffffff; --input-border:#d1d5db;
  --hover:#f3f4f6; --active-bg:#eef2ff;
  --danger-bg:#fee2e2; --warn-bg:#fef3c7; --warn-text:#b45309;
  --btn-sec-bg:#e5e7eb; --toast-bg:#1f2937; --toast-text:#fff;
  --loading-bg:rgba(255,255,255,.7);
  --radius:14px;
}
[data-theme="dark"]{
  --primary:#6366f1; --primary-dark:#818cf8;
  --bg:#0e1420; --card:#182034; --text:#e9edf5; --muted:#9aa5bb;
  --danger:#f87171; --ok:#34d399;
  --input-bg:#111a2e; --input-border:#2c3a58;
  --hover:#222c47; --active-bg:#26304f;
  --danger-bg:#3c2020; --warn-bg:#3a2f16; --warn-text:#fbbf24;
  --btn-sec-bg:#2a3552; --toast-bg:#e9edf5; --toast-text:#111827;
  --loading-bg:rgba(10,15,28,.72);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:16px; min-height:100vh;}
/* 顶栏 */
.appbar{position:sticky;top:0;z-index:10;background:var(--primary);color:#fff;
  padding:14px 16px calc(14px + env(safe-area-inset-top)) ;
  padding-top:calc(14px + env(safe-area-inset-top));
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 8px rgba(0,0,0,.15);}
.appbar h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.5px;}
.appbar .actions{display:flex;gap:8px;}
.btn{border:none;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600;
  cursor:pointer;background:var(--primary);color:#fff;}
.btn:active{opacity:.85;}
.btn.ghost{background:rgba(255,255,255,.18);color:#fff;padding:8px 14px;font-size:14px;}
.btn.secondary{background:var(--btn-sec-bg);color:var(--text);}
.btn.danger-btn{background:var(--danger-bg);color:var(--danger);}
.btn.block{width:100%;padding:14px;font-size:16px;}
/* 列表 */
.list{padding:16px 14px 96px;max-width:640px;margin:0 auto;}
.card{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;align-items:center;gap:10px;}
.card .info{flex:1;min-width:0;}
.card .title{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card .meta{color:var(--muted);font-size:13px;margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.badge{font-size:12px;background:var(--active-bg);color:var(--primary);border-radius:6px;padding:2px 8px;}
.badge.draft{background:var(--warn-bg);color:var(--warn-text);}
.icon-btn{border:none;background:var(--hover);border-radius:10px;width:44px;height:44px;font-size:18px;cursor:pointer;flex-shrink:0;}
.icon-btn.danger{background:var(--danger-bg);}
.empty{text-align:center;color:var(--muted);padding:60px 20px;line-height:1.8;}
/* FAB */
.fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));z-index:10;
  width:60px;height:60px;border-radius:50%;border:none;background:var(--primary);color:#fff;
  font-size:30px;line-height:1;box-shadow:0 4px 14px rgba(79,70,229,.4);cursor:pointer;}
.fab:active{transform:scale(.94);}
/* 编辑器 */
.editor{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;}
.editor.open{display:flex;}
.editor-bar{display:flex;align-items:center;gap:10px;background:var(--primary);color:#fff;
  padding:12px 12px;padding-top:calc(12px + env(safe-area-inset-top));}
.editor-bar h2{margin:0;font-size:17px;flex:1;}
.editor-bar .btn.ghost{padding:8px 14px;}
.editor-body{flex:1;overflow-y:auto;padding:16px 14px;max-width:640px;width:100%;margin:0 auto;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;}
.field input[type=text],.field input[type=date],.field textarea{
  width:100%;border:1px solid var(--input-border);border-radius:10px;padding:12px;font-size:16px;background:var(--input-bg);color:var(--text);}
.field textarea{min-height:300px;font-family:ui-monospace,Menlo,monospace;line-height:1.6;resize:vertical;}
.row2{display:flex;gap:12px;}
.row2 .field{flex:1;}
.check{display:flex;align-items:center;gap:10px;font-size:15px;padding:4px 0;}
.check input{width:22px;height:22px;accent-color:var(--primary);}
/* toast + loading */
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--toast-bg);color:var(--toast-text);padding:12px 20px;border-radius:12px;font-size:14px;max-width:86vw;
  opacity:0;transition:all .25s;z-index:50;pointer-events:none;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.loading{position:fixed;inset:0;z-index:40;background:var(--loading-bg);display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--muted);}
.loading.show{display:flex;}
.spinner{width:40px;height:40px;border:4px solid var(--btn-sec-bg);border-top-color:var(--primary);border-radius:50%;
  animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
/* 主题选择 */
.sheet-backdrop{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:none;
  align-items:flex-end;justify-content:center;}
.sheet-backdrop.show{display:flex;}
.sheet .btn.ghost{background:var(--btn-sec-bg);color:var(--text);width:100%;}
.plugin-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1px solid var(--input-border);background:var(--card);border-radius:12px;
  padding:12px 14px;margin-bottom:8px;font-size:15px;}
.btn.sm{padding:6px 14px;font-size:14px;width:auto;}
.btn.danger-btn.sm{background:var(--danger-bg);}
#updLater{background:var(--btn-sec-bg);color:var(--text);width:100%;}

.mdbar{display:flex;gap:6px;overflow-x:auto;padding:8px 2px;margin-bottom:2px;}
.mdbar button{flex:0 0 auto;min-width:40px;height:36px;border:1px solid var(--input-border);background:var(--card);
  border-radius:9px;font-size:15px;font-weight:700;color:var(--text);cursor:pointer;padding:0 10px;}
.mdbar button:active{background:var(--active-bg);border-color:var(--primary);}
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;}
.drawer-backdrop.show{display:block;}
.drawer{position:fixed;top:0;left:0;bottom:0;width:272px;max-width:82vw;background:var(--card);z-index:41;
  transform:translateX(-106%);transition:transform .24s ease;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;touch-action:pan-y;
  padding:14px 12px calc(20px + env(safe-area-inset-bottom));box-shadow:2px 0 14px rgba(0,0,0,.18);}
.drawer.open{transform:none;}
.drawer-head{font-size:20px;font-weight:700;padding:6px 10px 10px;color:var(--primary);}
.drawer-sec{font-size:12px;color:var(--muted);padding:14px 10px 4px;letter-spacing:1px;}
.drawer-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;
  padding:12px 10px;font-size:15px;border-radius:10px;cursor:pointer;text-align:left;color:var(--text);}
.drawer-item:active{background:var(--hover);}
.drawer-item small{color:var(--muted);font-size:12px;margin-left:auto;}
.sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:640px;
  padding:20px 18px calc(24px + env(safe-area-inset-bottom));}
.sheet h3{margin:0 0 14px;font-size:17px;}
.theme-opt{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--input-border);
  background:var(--card);border-radius:12px;padding:14px 16px;font-size:16px;margin-bottom:10px;cursor:pointer;text-align:left;}
.theme-opt .dot{width:22px;height:22px;border-radius:50%;flex-shrink:0;border:1px solid var(--input-border);}
.theme-opt.current{border-color:var(--primary);background:var(--active-bg);}
.theme-opt .check{margin-left:auto;color:var(--primary);font-weight:700;}
.proj-card{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--input-border);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.proj-card .info{flex:1;min-width:0}
.proj-card .info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-card .info small{color:var(--muted);font-size:13px}
.file-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--input-border);border-radius:10px;padding:8px 12px;margin-bottom:6px}
.file-row .fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.file-row .fsize{color:var(--muted);font-size:13px;flex-shrink:0}
.icon-btn{background:none;border:none;font-size:18px;padding:6px;cursor:pointer;flex-shrink:0;line-height:1}
</style>
</head>
<body>

<div class="appbar">
  <div style="display:flex;align-items:center;gap:6px">
    <button class="btn ghost" onclick="openDrawer()" data-i18n-aria="top.menu_aria" aria-label="菜单">☰</button>
    <h1 data-i18n="app.name">WebWeave</h1>
  </div>
  <div class="actions">
    <button class="btn ghost" data-i18n="top.preview" onclick="doPreview()">预览</button>
    <button class="btn ghost" data-i18n="top.build" onclick="openBuildDialog()">构建</button>
  </div>
</div>

<div class="drawer-backdrop" id="drawerBackdrop" onclick="closeDrawer()"></div>
<nav class="drawer" id="drawer">
  <div class="drawer-head" style="display:flex;align-items:center;justify-content:space-between">mssg
    <button class="btn ghost" style="padding:6px 12px" onclick="closeDrawer()">✕</button>
  </div>
  <button class="drawer-item" data-i18n="drawer.ai_build" onclick="closeDrawer();openAiBuild()">✨ AI 建站</button>
  <div class="drawer-sec" data-i18n="drawer.sec_content">内容</div>
  <button class="drawer-item" data-i18n="drawer.new_post" onclick="closeDrawer();openEditor()">✏️ 新建文章</button>
  <div class="drawer-sec" data-i18n="drawer.sec_build">构建</div>
  <button class="drawer-item" data-i18n="drawer.build" onclick="closeDrawer();doBuild()">🔨 构建站点</button>
  <button class="drawer-item" data-i18n="drawer.preview" onclick="closeDrawer();doPreview()">👁 预览站点</button>
  <button class="drawer-item" data-i18n="drawer.projects" onclick="closeDrawer();openFiles()">📁 构建项目</button>
  <button class="drawer-item" data-i18n="drawer.clean" onclick="closeDrawer();doCleanBuild()">🧹 清除构建产物</button>
  <div class="drawer-sec" data-i18n="drawer.sec_publish">发布</div>
  <button class="drawer-item" data-i18n="drawer.export" onclick="closeDrawer();openExport()">📦 导出 ZIP</button>
  <button class="drawer-item" data-i18n="drawer.cf" onclick="closeDrawer();openCf()">☁️ 部署到 Cloudflare Pages</button>
  <button class="drawer-item" data-i18n="drawer.backup" onclick="closeDrawer();doBackupSite()">🗄️ 备份站点源码</button>
  <button class="drawer-item" data-i18n="drawer.restore" onclick="closeDrawer();pickBackup()">📥 从备份恢复</button>
  <div class="drawer-sec" data-i18n="drawer.sec_settings">设置</div>
  <button class="drawer-item" data-i18n="drawer.dark" onclick="toggleTheme()">🌙 深色模式<small id="themeLabel"></small></button>
  <button class="drawer-item" data-i18n="drawer.plugins" onclick="closeDrawer();openPlugins()">🧩 扩展商店</button>
  <button class="drawer-item" data-i18n="drawer.check_update" onclick="closeDrawer();checkUpdate(true)">🔄 检查更新<small id="verLabelD"></small></button>
  <button class="drawer-item" onclick="setLang(APP_LANG==='zh'?'en':'zh')">🌐 <span data-i18n="drawer.language">语言 / Language</span></button>
</nav>

<div id="homeThemes" style="padding:10px 14px 0"></div>
<div class="list" id="list"></div>

<button class="fab" onclick="openEditor()" data-i18n-aria="top.new_aria" aria-label="新建">＋</button>

<div class="editor" id="editor">
  <div class="editor-bar">
    <button class="btn ghost" data-i18n="editor.back" onclick="closeEditor()">‹ 返回</button>
    <h2 id="editorTitle" data-i18n="editor.new">新建文章</h2>
    <button class="btn ghost" data-i18n="editor.share" onclick="doSharePage()">分享</button>
    <button class="btn ghost" data-i18n="editor.save" onclick="doSave()">保存</button>
  </div>
  <div class="editor-body">
    <div class="field">
      <label data-i18n="editor.title">标题</label>
      <input type="text" id="f_title" data-i18n-ph="editor.title_ph" placeholder="文章标题">
    </div>
    <div class="row2">
      <div class="field">
        <label data-i18n="editor.file">文件名（content/ 下相对路径）</label>
        <input type="text" id="f_rel" placeholder="post/hello.md">
      </div>
      <div class="field">
        <label data-i18n="editor.date">日期</label>
        <input type="date" id="f_date">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label data-i18n="editor.tags">标签（逗号分隔）</label>
        <input type="text" id="f_tags" data-i18n-ph="editor.tags_ph" placeholder="生活, 随笔">
      </div>
      <div class="field">
        <label data-i18n="editor.category">分类（逗号分隔）</label>
        <input type="text" id="f_categories" placeholder="">
      </div>
    </div>
    <div class="field">
      <label class="check"><input type="checkbox" id="f_draft"> <span data-i18n="editor.draft">草稿（不发布）</span></label>
    </div>
    <div class="field">
      <label data-i18n="editor.content">正文（Markdown）</label>
      <div class="mdbar">
        <button type="button" onclick="mdLinePrefix('## ')" data-i18n-title="editor.tb_h" title="标题">H</button>
        <button type="button" onclick="mdWrap('**','**','加粗')" data-i18n-title="editor.tb_b" title="加粗">B</button>
        <button type="button" onclick="mdWrap('*','*','斜体')" data-i18n-title="editor.tb_i" title="斜体"><i>I</i></button>
        <button type="button" onclick="mdLink()" data-i18n-title="editor.tb_link" title="链接">🔗</button>
        <button type="button" onclick="mdImageUrl()" data-i18n-title="editor.tb_imglink" title="图片链接">🖼️</button>
        <button type="button" onclick="pickImage()" data-i18n-title="editor.tb_album" title="从相册插入">📷</button>
        <button type="button" onclick="mdLinePrefix('- ')" data-i18n-title="editor.tb_list" title="列表">☰</button>
        <button type="button" onclick="mdLinePrefix('> ')" data-i18n-title="editor.tb_quote" title="引用">❝</button>
        <button type="button" onclick="mdWrap('`','`','代码')" data-i18n-title="editor.tb_code" title="行内代码">‹›</button>
        <button type="button" onclick="openAi()" data-i18n-title="editor.tb_ai" title="AI 写作助手">🤖</button>
      </div>
      <textarea id="f_body" data-i18n-ph="editor.body_ph" placeholder="# 标题&#10;&#10;正文…"></textarea>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="loading" id="loading"><div class="spinner"></div><div data-i18n="common.processing">处理中…</div></div>

<div class="editor" id="cssEditor">
  <div class="editor-bar">
    <button class="btn ghost" data-i18n="editor.back" onclick="closeCssEditor()">‹ 返回</button>
    <h2 data-i18n="css.title">自定义 CSS</h2>
    <button class="btn ghost" data-i18n="css.restore" onclick="clearCss()">恢复默认</button>
    <button class="btn ghost" data-i18n="css.apply" onclick="saveCss()">应用</button>
  </div>
  <div class="editor-body">
    <div class="field">
      <label id="cssHint" data-i18n="css.hint_base">在当前主题样式基础上改，点"应用"实时生效</label>
      <textarea id="f_css" style="min-height:60vh" spellcheck="false"></textarea>
    </div>
  </div>
</div>

<div class="sheet-backdrop" id="themeSheet" onclick="if(event.target===this)closeThemes()">
  <div class="sheet">
    <h3 data-i18n="theme.title">选择主题</h3>
    <div id="themeList"></div>
    <button class="theme-opt" onclick="closeThemes();openCssEditor()">
      <span>✏️</span><span><span data-i18n="css.title">自定义 CSS</span><span id="cssBadge"></span><br><small style="color:var(--muted)" data-i18n="theme.custom_hint">随意改样式，实时预览</small></span>
    </button>
  </div>
</div>

<div class="sheet-backdrop" id="exportSheet" onclick="if(event.target===this)closeExport()">
  <div class="sheet">
    <h3 data-i18n="export.title">导出 ZIP</h3>
    <div id="buildInfo" style="font-size:13px;color:var(--muted);margin:0 4px 8px"></div>
    <button class="theme-opt" onclick="doExportZip(true)">
      <span>💾</span><span><span data-i18n="export.save">保存 ZIP 到下载</span><br><small style="color:var(--muted)" data-i18n="export.save_hint">用于上传到 Cloudflare Pages / Netlify</small></span>
    </button>
    <button class="theme-opt" onclick="doExportZip(false)">
      <span>📤</span><span><span data-i18n="export.share">分享 ZIP</span><br><small style="color:var(--muted)" data-i18n="export.share_hint">通过微信 / 邮件 / 云盘发送</small></span>
    </button>
    <div style="font-size:13px;color:var(--muted);margin:0 4px 8px" data-i18n="export.moved_hint">更多操作（部署、备份、构建文件、检查更新）已移到左上角 ☰ 菜单</div>
  </div>
</div>

<div class="sheet-backdrop" id="aiBuildSheet" onclick="if(event.target===this)closeAiBuild()">
  <div class="sheet" style="max-height:86vh;display:flex;flex-direction:column">
    <h3 data-i18n="aibuild.title">✨ AI 建站</h3>
    <div class="field"><label data-i18n="aibuild.desc">一句话描述你想要的网站</label>
      <textarea id="aiBuildDesc" rows="3" data-i18n-ph="aibuild.desc_ph" placeholder="比如：一个摄影作品集网站，深色风格，有首页、作品、关于我"></textarea>
    </div>
    <div class="field"><label data-i18n="aibuild.theme">主题</label>
      <select id="aiBuildTheme">
        <option value="auto" data-i18n="ai.theme_auto">让 AI 选</option>
        <option value="minimal">minimal</option>
        <option value="company">company</option>
      </select>
    </div>
    <button class="btn" data-i18n="aibuild.generate" onclick="runAiBuild()" style="margin-bottom:8px">🚀 生成网站</button>
    <div id="aiBuildResult" style="display:none">
      <div class="field"><label data-i18n="ai.result">结果</label>
        <div id="aiBuildMsg" style="font-size:15px;margin-bottom:10px"></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
        <button class="btn sm" data-i18n="aibuild.preview" onclick="aiPreview()">👁 预览</button>
        <button class="btn sm" data-i18n="aibuild.promote" onclick="aiPromote()">设为我的站点</button>
      </div>
    </div>
    <button class="btn ghost" data-i18n="common.close" onclick="closeAiBuild()">关闭</button>
  </div>
</div>

<div class="sheet-backdrop" id="aiSheet" onclick="if(event.target===this)closeAi()">
  <div class="sheet" style="max-height:86vh;display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <h3 style="margin:0;flex:1" data-i18n="ai.title">🤖 AI 助手</h3>
      <select id="aiPluginSel" onchange="switchAiPlugin(this.value)" style="display:none;max-width:45%"></select>
    </div>
    <div id="aiActions" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px"></div>
    <div id="aiResultWrap" style="display:none;margin-bottom:10px">
      <div class="field"><label data-i18n="ai.result">结果</label>
        <div id="aiResult" style="border:1px solid var(--input-border);background:var(--card);border-radius:12px;padding:12px 14px;max-height:30vh;overflow-y:auto;white-space:pre-wrap;font-size:15px"></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn sm" data-i18n="ai.insert" onclick="aiInsert()">插入到光标</button>
        <button class="btn sm" data-i18n="ai.replace" onclick="aiReplace()">替换全文</button>
        <button class="btn ghost sm" data-i18n="ai.copy" onclick="aiCopy()">复制</button>
      </div>
    </div>
    <div class="drawer-sec"><span data-i18n="ai.settings">接口设置</span> <small style="color:var(--muted)" data-i18n="ai.openai_compat">兼容 OpenAI 格式</small></div>

    <div class="field"><label data-i18n="ai.key">API Key</label><input type="password" id="ai_key" placeholder="sk-…"></div>
    <div class="field"><label data-i18n="ai.model">模型</label>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="text" id="ai_model" placeholder="deepseek-chat" style="flex:1">
        <button class="btn sm" onclick="openModelPicker()" data-i18n-title="ai.model_pick" title="选择模型" style="font-size:18px;padding:8px 12px">☰</button>
      </div></div>
    <button class="btn" data-i18n="ai.save_settings" onclick="saveAiSettings()" style="margin-bottom:8px">保存设置</button>
    <button class="btn ghost" data-i18n="common.close" onclick="closeAi()">关闭</button>
  </div>
</div>

<div class="sheet-backdrop" id="modelPicker" onclick="if(event.target===this)closeModelPicker()">
  <div class="sheet" style="max-height:78vh;display:flex;flex-direction:column">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3 style="margin:0" data-i18n="model_picker.title">可用模型列表</h3>
      <button class="btn sm" onclick="fetchAiModels()" data-i18n-title="model_picker.refresh" title="刷新" style="border-radius:50%;width:38px;height:38px;padding:0;font-size:16px">🔄</button>
    </div>
    <div class="field"><input type="text" id="modelSearch" data-i18n-ph="model_picker.search_ph" placeholder="🔍 搜索模型" oninput="renderModelList()"></div>
    <div id="modelList" style="overflow-y:auto;flex:1;min-height:120px;margin:0 -4px 8px"></div>
    <div id="modelCount" style="font-size:13px;color:var(--muted);margin-bottom:10px"></div>
    <div style="display:flex;gap:8px">
      <button class="btn ghost" data-i18n="model_picker.close" onclick="closeModelPicker()" style="flex:1">关闭</button>
      <button class="btn" id="modelConfirmBtn" data-i18n="model_picker.confirm" onclick="confirmModel()" style="flex:1">确定</button>
    </div>
  </div>
</div>

<div class="sheet-backdrop" id="pluginSheet" onclick="if(event.target===this)closePlugins()">
  <div class="sheet" style="max-height:82vh;display:flex;flex-direction:column">

<div class="sheet-backdrop" id="buildSheet" onclick="if(event.target===this)closeBuildDialog()">

<div class="sheet-backdrop" id="filesSheet" onclick="if(event.target===this)closeFiles()">

<div class="sheet-backdrop" id="updateSheet" onclick="if(event.target===this)closeUpdate()">

let APP_LANG = "zh";
try{ APP_LANG = localStorage.getItem("app_lang") || "zh"; }catch(e){}
setTimeout(()=>{ try{ bridge().setAppLang(APP_LANG); }catch(e){} try{ renderHomeThemes(); }catch(e){} }, 1500);
function t(key){
  const d = I18N[APP_LANG] || I18N.zh;
  return (d[key] !== undefined) ? d[key] : (I18N.zh[key] || key);
}
function setLang(l){
  APP_LANG = (l === "en") ? "en" : "zh";
  try{ localStorage.setItem("app_lang", APP_LANG); }catch(e){}
  try{ bridge().setAppLang(APP_LANG); }catch(e){}
  document.getElementById("htmlRoot").lang = APP_LANG;
  document.title = t("app.name");
  applyI18n();
}
function applyI18n(){
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const k = el.getAttribute("data-i18n");
    el.innerHTML = t(k);
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => {
    el.placeholder = t(el.getAttribute("data-i18n-ph"));
  });
  document.querySelectorAll("[data-i18n-title]").forEach(el => {
    el.title = t(el.getAttribute("data-i18n-title"));
  });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => {
    el.setAttribute("aria-label", t(el.getAttribute("data-i18n-aria")));
  });
  try{ renderHomeThemes(); }catch(e){}
  try{ refresh(); }catch(e){}
}

function toast(msg, ms=2600){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove("show"), ms);
}
let loadingTimer = null;
function loading(show){
  if(show){
    // 延迟 350ms 再显示：快速操作直接过去，不白闪一下
    if(loadingTimer) clearTimeout(loadingTimer);
    loadingTimer = setTimeout(()=>{ loadingTimer = null; $("loading").classList.add("show"); }, 350);
  }else{
    if(loadingTimer){ clearTimeout(loadingTimer); loadingTimer = null; }
    $("loading").classList.remove("show");
  }
}
/* 让出一次绘制机会，避免同步桥调用卡住时 loading 画不出来 */
function withLoading(fn){
  loading(true);
  setTimeout(()=>{ try{ fn(); } finally{ loading(false); } }, 60);
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,
    c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function refresh(){
  let r;
  try{ renderHomeThemes(); }catch(e){}
  try{ r = JSON.parse(bridge().listPages()); }
  catch(e){ toast(t("msg.engine_not_ready")+e); return; }
  if(!r.ok){ toast(r.msg); return; }
  const pages = r.pages || [];
  const el = $("list");
  if(!pages.length){
    el.innerHTML = '<div class="empty">' + t("home.empty") + '</div>';
    return;
  }
  el.innerHTML = pages.map(p=>{
    const badges = `<span class="badge">${esc(p.lang||"")}</span>` +
      (p.draft ? ' <span class="badge draft">'+t("editor.draft")+'</span>' : '');
    return `<div class="card" onclick="openEditor('${esc(p.rel)}')">
      <div class="info">
        <div class="title">${esc(p.title)}</div>
        <div class="meta"><span>${esc(p.date||"")}</span>${badges}</div>
      </div>
      <button class="icon-btn danger" onclick="event.stopPropagation();doDelete('${esc(p.rel)}','${esc(p.title)}')">🗑</button>
    </div>`;
  }).join("");
}

function openEditor(rel){
  editingRel = rel || null;
  $("editorTitle").textContent = rel ? t("editor.edit") : t("editor.new");
  if(rel){
    let r;
    try{ r = JSON.parse(bridge().getPage(rel)); }
    catch(e){ toast(t("msg.read_fail")+e); return; }
    if(!r.ok){ toast(r.msg); return; }
    const m = r.meta || {};
    $("f_rel").value = rel;
    $("f_rel").disabled = true;
    $("f_title").value = m.title || "";
    $("f_date").value = m.date || "";
    $("f_tags").value = (m.tags||[]).join(", ");
    $("f_categories").value = (m.categories||[]).join(", ");
    $("f_draft").checked = !!m.draft;
    $("f_body").value = r.body || "";
  }else{
    $("f_rel").value = "post/";
    $("f_rel").disabled = false;
    $("f_title").value = "";
    $("f_date").value = new Date().toISOString().slice(0,10);
    $("f_tags").value = "";
    $("f_categories").value = "";
    $("f_draft").checked = false;
    $("f_body").value = "";
  }
  $("editor").classList.add("open");
}

/* Markdown 工具栏 */
function mdArea(){ return $("f_body"); }
function mdInsert(text){
  const ta = mdArea();
  const s = ta.selectionStart, e = ta.selectionEnd;
  ta.value = ta.value.slice(0, s) + text + ta.value.slice(e);
  ta.selectionStart = ta.selectionEnd = s + text.length;
  ta.focus();
}
function mdWrap(before, after, placeholder){
  const ta = mdArea();
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.slice(s, e) || placeholder;
  ta.value = ta.value.slice(0, s) + before + sel + after + ta.value.slice(e);
  ta.selectionStart = s + before.length;
  ta.selectionEnd = s + before.length + sel.length;
  ta.focus();
}
function mdLinePrefix(prefix){
  // 当前行行首加前缀（已有则去掉）
  const ta = mdArea();
  const s = ta.selectionStart, v = ta.value;
  const ls = v.lastIndexOf("\n", s - 1) + 1;
  let le = v.indexOf("\n", s); if(le === -1) le = v.length;
  const line = v.slice(ls, le);
  let nline, delta;
  if(line.startsWith(prefix)){ nline = line.slice(prefix.length); delta = -prefix.length; }
  else { nline = prefix + line; delta = prefix.length; }
  ta.value = v.slice(0, ls) + nline + v.slice(le);
  ta.selectionStart = ta.selectionEnd = Math.max(ls, s + delta);
  ta.focus();
}
function mdLink(){
  const ta = mdArea();
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.slice(s, e) || t("editor.link_text");
  const ins = "[" + sel + "]()";
  ta.value = ta.value.slice(0, s) + ins + ta.value.slice(e);
  ta.selectionStart = ta.selectionEnd = s + ins.length - 1; // 光标进括号填 URL
  ta.focus();
}
function mdImageUrl(){
  mdInsert("!["+t("editor.image_alt")+"]()");
  const ta = mdArea();
  ta.selectionStart = ta.selectionEnd = ta.selectionStart - 1; // 光标进括号填 URL
  ta.focus();
}

function onBackupPicked(path, articles, sizeHuman){
  withLoading(()=>{
    const tip = t("msg.confirm_restore").replace("{articles}", articles).replace("{size}", sizeHuman);
    if(!confirm(tip)){ try{ bridge().discardBackup(path); }catch(e){} return; }
    let r;
    try{ r = JSON.parse(bridge().restoreBackup(path)); }
    catch(e){ toast(t("msg.restore_fail")+e); return; }
    if(!r.ok){ toast(t("msg.restore_fail")+r.msg, 3600); return; }
    toast(t("msg.restored").replace("{articles}", r.articles), 3000);
    let b;
    try{ b = JSON.parse(bridge().buildSite()); }
    catch(e){ toast(t("msg.build_fail")+e, 3600); refresh(); return; }
    toast(b.ok ? t("msg.restore_done").replace("{msg}", b.msg||"") : t("msg.build_fail")+b.msg, 3600);
    refresh();
  });
}

function slugify(s){
  const slug = (s || "").trim().toLowerCase()
    .replace(/[\s_]+/g, "-").replace(/[^\w\u4e00-\u9fff-]+/g, "")
    .replace(/-+/g, "-").replace(/^-|-$/g, "");
  return slug || ("post-" + Date.now().toString(36));
}

function extractJson(text){
  let t = String(text || "").trim();
  const m = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  if(m) t = m[1].trim();
  const i = t.indexOf("{"), j = t.lastIndexOf("}");
  if(i >= 0 && j > i) t = t.slice(i, j + 1);
  return t;
}

/* ============ PluginHost：通用插件宿主 ============
 * APK 不认识插件类型，只认 manifest.contributions 声明。
 * 扩展点（extension point）是稳定 API，插件声明贡献到哪个点，
 * Host 就渲染到哪里。新增插件类型无需改 APK。
 * 兼容老 manifest：type=ai + 顶层 actions 自动归一化为 ai.actions。
 */
const PluginHost = {
  plugins: [],  // [{name, description, version, contributions}]
  normalize(manifest){
    const c = Object.assign({}, manifest.contributions || {});
    if(manifest.type === "ai" && manifest.actions && !c["ai.actions"]){
      c["ai.actions"] = manifest.actions;
    }
    return c;
  },
  load(){
    this.plugins = [];
    try{
      const r = JSON.parse(bridge().listPlugins());
      if(r.ok && r.plugins){
        this.plugins = r.plugins.map(p => {
          let m = {};
          try{ m = JSON.parse(p.manifest); }catch(e){}
          return {
            name: p.name,
            description: p.description || m.description || "",
            version: p.version || m.version || "",
            contributions: this.normalize(m),
          };
        });
      }
    }catch(e){}
    // 兼容只有老接口的极端情况
    if(!this.plugins.length){
      try{
        const r = JSON.parse(bridge().listAiPlugins());
        if(r.ok && r.plugins){
          this.plugins = r.plugins.map(p => ({name: p.name, description: "", version: "", contributions: {}}));
        }
      }catch(e){}
    }
  },
  /* 取某扩展点的所有贡献：[{plugin, pluginDesc, items}] */
  contributions(point){
    const out = [];
    for(const p of this.plugins){
      const items = p.contributions[point];
      if(items && items.length) out.push({plugin: p.name, pluginDesc: p.description, items: items});
    }
    return out;
  },
};

/* 检查更新 */
let UPD_URL = "";
function cmpVer(a, b){
  const pa = a.split(".").map(x=>parseInt(x)||0), pb = b.split(".").map(x=>parseInt(x)||0);
  for(let i=0;i<Math.max(pa.length,pb.length);i++){
    const d = (pa[i]||0) - (pb[i]||0);
    if(d) return d;
  }
  return 0;
}
let UPD_MANUAL = false, UPD_WAITING = false;
const UPDATE_JSON_URL =
  "https://raw.githubusercontent.com/fghijkln/mssg-android/master/update.json";
function checkUpdate(manual){
  // 数据源：仓库内 update.json（GitHub API 对匿名请求 /releases/* 经常 404，不可靠）
  UPD_MANUAL = manual; UPD_WAITING = true;
  loading(true);
  setTimeout(()=>{
    if(UPD_WAITING){ UPD_WAITING = false; loading(false); if(UPD_MANUAL) toast(t("msg.check_timeout")); }
  }, 30000);
  try{ bridge().fetchText("update", UPDATE_JSON_URL); }
  catch(e){ UPD_WAITING = false; loading(false); if(manual) toast(t("msg.check_fail")+e); }
}
function onFetchText(tag, raw){
  if(tag === "plugins"){ onPluginsFetched(raw); return; }
  if(tag === "pluginfile"){ onPluginFileFetched(raw); return; }
  if(tag === "ai"){ onAiResult(raw); return; }
  if(tag === "aibuild"){ onAiBuildResult(raw); return; }
  if(tag === "aifile"){ onAiFileFetched(raw); return; }
  if(tag !== "update" || !UPD_WAITING) return;
  UPD_WAITING = false; loading(false);
  const manual = UPD_MANUAL;
  let r;
  try{ r = JSON.parse(raw); }catch(e){ if(manual) toast(t("msg.parse_fail")); return; }
  if(!r || r.error || r.status !== 200){
    if(manual) toast(t("msg.check_fail") + ((r && (r.error || ("HTTP " + r.status))) || t("msg.unknown_error")));
    return;
  }
  let j;
  try{ j = JSON.parse(r.body); }catch(e){ if(manual) toast(t("msg.parse_fail")); return; }
  const latest = String(j.latest || "").replace(/^v/, "");
  if(!latest){ if(manual) toast(t("msg.no_version")); return; }
  let cur = "";
  try{ cur = bridge().getAppVersion(); }catch(e){}
  if(cmpVer(latest, cur) > 0){
    UPD_URL = j.apk ||
      ("https://github.com/fghijkln/mssg-android/releases/tag/v" + latest);
    $("updVer").textContent = "v" + latest;
    $("updBody").textContent = String((APP_LANG==="en" && j.notes_en) ? j.notes_en : (j.notes || t("msg.no_notes"))).slice(0, 1200);
    $("updateSheet").classList.add("show");
  }else if(manual){
    toast(t("msg.up_to_date") + cur + ")");
  }
}
function closeUpdate(){ $("updateSheet").classList.remove("show"); }
function doUpdateDownload(){
  if(!UPD_URL) return;
  closeUpdate();
  try{ bridge().downloadUpdate(UPD_URL); }
  catch(e){ toast(t("msg.download_fail") + e); }
}

    try{ r = JSON.parse(bridge().exportPageHtml(rel)); }
    catch(e){ toast(t("msg.export_fail")+e); return; }
    if(!r.ok){ toast(r.msg); return; }
    bridge().shareFile(r.path, r.name || "page.html", "text/html");
    toast(t("msg.opening_share"));
  });
}

/* 自定义 CSS */
function openCssEditor(){
  let r;
  try{ r = JSON.parse(bridge().getCustomCss()); }
  catch(e){ toast(t("msg.read_fail")+e); return; }
  if(!r.ok){ toast(r.msg); return; }
  $("f_css").value = r.css || "";
  $("cssHint").textContent = r.is_custom ? t("css.hint_override") : t("css.hint_base");
  $("cssEditor").classList.add("open");
}
function closeCssEditor(){ $("cssEditor").classList.remove("open"); }
function saveCss(){
  withLoading(()=>{
    let r;
    try{ r = JSON.parse(bridge().saveCustomCss($("f_css").value)); }
    catch(e){ toast(t("msg.apply_fail")+e); return; }
    toast(r.ok ? t("msg.applied") + (r.msg||"") : r.msg);
  });
}
function clearCss(){
  if(!confirm(t("msg.confirm_clear_css"))) return;
  withLoading(()=>{
    let r;
    try{ r = JSON.parse(bridge().clearCustomCss()); }
    catch(e){ toast(t("msg.clean_fail")+e); return; }
    if(r.ok){ toast(t("msg.css_restored")); openCssEditor(); }
    else toast(r.msg);
  });
}

document.addEventListener("DOMContentLoaded", refresh);
// 启动时按保存的语言渲染一次静态文本：否则重进 App 永远显示中文，
// 而且第一次点语言切换会从"真实已是 en"切到 zh，看起来像要点两次才生效。
try{ applyI18n(); }catch(e){}
