<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>织网</title>
<style>
:root{
  --primary:#4f46e5; --primary-dark:#4338ca;
  --bg:#f4f5f7; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
  --danger:#dc2626; --ok:#059669;
  --input-bg:#ffffff; --input-border:#d1d5db;
  --hover:#f3f4f6; --active-bg:#eef2ff;
  --danger-bg:#fee2e2; --warn-bg:#fef3c7; --warn-text:#b45309;
  --btn-sec-bg:#e5e7eb; --toast-bg:#1f2937; --toast-text:#fff;
  --loading-bg:rgba(255,255,255,.7);
  --radius:14px;
}
[data-theme="dark"]{
  --primary:#6366f1; --primary-dark:#818cf8;
  --bg:#0e1420; --card:#182034; --text:#e9edf5; --muted:#9aa5bb;
  --danger:#f87171; --ok:#34d399;
  --input-bg:#111a2e; --input-border:#2c3a58;
  --hover:#222c47; --active-bg:#26304f;
  --danger-bg:#3c2020; --warn-bg:#3a2f16; --warn-text:#fbbf24;
  --btn-sec-bg:#2a3552; --toast-bg:#e9edf5; --toast-text:#111827;
  --loading-bg:rgba(10,15,28,.72);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:16px; min-height:100vh;}
/* 顶栏 */
.appbar{position:sticky;top:0;z-index:10;background:var(--primary);color:#fff;
  padding:14px 16px calc(14px + env(safe-area-inset-top)) ;
  padding-top:calc(14px + env(safe-area-inset-top));
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 8px rgba(0,0,0,.15);}
.appbar h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.5px;}
.appbar .actions{display:flex;gap:8px;}
.btn{border:none;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600;
  cursor:pointer;background:var(--primary);color:#fff;}
.btn:active{opacity:.85;}
.btn.ghost{background:rgba(255,255,255,.18);color:#fff;padding:8px 14px;font-size:14px;}
.btn.secondary{background:var(--btn-sec-bg);color:var(--text);}
.btn.danger-btn{background:var(--danger-bg);color:var(--danger);}
.btn.block{width:100%;padding:14px;font-size:16px;}
/* 列表 */
.list{padding:16px 14px 96px;max-width:640px;margin:0 auto;}
.card{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;align-items:center;gap:10px;}
.card .info{flex:1;min-width:0;}
.card .title{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card .meta{color:var(--muted);font-size:13px;margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.badge{font-size:12px;background:var(--active-bg);color:var(--primary);border-radius:6px;padding:2px 8px;}
.badge.draft{background:var(--warn-bg);color:var(--warn-text);}
.icon-btn{border:none;background:var(--hover);border-radius:10px;width:44px;height:44px;font-size:18px;cursor:pointer;flex-shrink:0;}
.icon-btn.danger{background:var(--danger-bg);}
.empty{text-align:center;color:var(--muted);padding:60px 20px;line-height:1.8;}
/* FAB */
.fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));z-index:10;
  width:60px;height:60px;border-radius:50%;border:none;background:var(--primary);color:#fff;
  font-size:30px;line-height:1;box-shadow:0 4px 14px rgba(79,70,229,.4);cursor:pointer;}
.fab:active{transform:scale(.94);}
/* 编辑器 */
.editor{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;}
.editor.open{display:flex;}
.editor-bar{display:flex;align-items:center;gap:10px;background:var(--primary);color:#fff;
  padding:12px 12px;padding-top:calc(12px + env(safe-area-inset-top));}
.editor-bar h2{margin:0;font-size:17px;flex:1;}
.editor-bar .btn.ghost{padding:8px 14px;}
.editor-body{flex:1;overflow-y:auto;padding:16px 14px;max-width:640px;width:100%;margin:0 auto;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;}
.field input[type=text],.field input[type=date],.field textarea{
  width:100%;border:1px solid var(--input-border);border-radius:10px;padding:12px;font-size:16px;background:var(--input-bg);color:var(--text);}
.field textarea{min-height:300px;font-family:ui-monospace,Menlo,monospace;line-height:1.6;resize:vertical;}
.row2{display:flex;gap:12px;}
.row2 .field{flex:1;}
.check{display:flex;align-items:center;gap:10px;font-size:15px;padding:4px 0;}
.check input{width:22px;height:22px;accent-color:var(--primary);}
/* toast + loading */
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--toast-bg);color:var(--toast-text);padding:12px 20px;border-radius:12px;font-size:14px;max-width:86vw;
  opacity:0;transition:all .25s;z-index:50;pointer-events:none;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.loading{position:fixed;inset:0;z-index:40;background:var(--loading-bg);display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--muted);}
.loading.show{display:flex;}
.spinner{width:40px;height:40px;border:4px solid var(--btn-sec-bg);border-top-color:var(--primary);border-radius:50%;
  animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
/* 主题选择 */
.sheet-backdrop{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:none;
  align-items:flex-end;justify-content:center;}
.sheet-backdrop.show{display:flex;}
.sheet .btn.ghost{background:var(--btn-sec-bg);color:var(--text);width:100%;}
.plugin-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1px solid var(--input-border);background:var(--card);border-radius:12px;
  padding:12px 14px;margin-bottom:8px;font-size:15px;}
.btn.sm{padding:6px 14px;font-size:14px;width:auto;}
.btn.danger-btn.sm{background:var(--danger-bg);}
#updLater{background:var(--btn-sec-bg);color:var(--text);width:100%;}

.mdbar{display:flex;gap:6px;overflow-x:auto;padding:8px 2px;margin-bottom:2px;}
.mdbar button{flex:0 0 auto;min-width:40px;height:36px;border:1px solid var(--input-border);background:var(--card);
  border-radius:9px;font-size:15px;font-weight:700;color:var(--text);cursor:pointer;padding:0 10px;}
.mdbar button:active{background:var(--active-bg);border-color:var(--primary);}
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;}
.drawer-backdrop.show{display:block;}
.drawer{position:fixed;top:0;left:0;bottom:0;width:272px;max-width:82vw;background:var(--card);z-index:41;
  transform:translateX(-106%);transition:transform .24s ease;overflow-y:auto;
  padding:14px 12px calc(20px + env(safe-area-inset-bottom));box-shadow:2px 0 14px rgba(0,0,0,.18);}
.drawer.open{transform:none;}
.drawer-head{font-size:20px;font-weight:700;padding:6px 10px 10px;color:var(--primary);}
.drawer-sec{font-size:12px;color:var(--muted);padding:14px 10px 4px;letter-spacing:1px;}
.drawer-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;
  padding:12px 10px;font-size:15px;border-radius:10px;cursor:pointer;text-align:left;color:var(--text);}
.drawer-item:active{background:var(--hover);}
.drawer-item small{color:var(--muted);font-size:12px;margin-left:auto;}
.sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:640px;
  padding:20px 18px calc(24px + env(safe-area-inset-bottom));}
.sheet h3{margin:0 0 14px;font-size:17px;}
.theme-opt{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--input-border);
  background:var(--card);border-radius:12px;padding:14px 16px;font-size:16px;margin-bottom:10px;cursor:pointer;text-align:left;}
.theme-opt .dot{width:22px;height:22px;border-radius:50%;flex-shrink:0;border:1px solid var(--input-border);}
.theme-opt.current{border-color:var(--primary);background:var(--active-bg);}
.theme-opt .check{margin-left:auto;color:var(--primary);font-weight:700;}
</style>
</head>
<body>

<div class="appbar">
  <div style="display:flex;align-items:center;gap:6px">
    <button class="btn ghost" onclick="openDrawer()" aria-label="菜单">☰</button>
    <h1>织网</h1>
  </div>
  <div class="actions">
    <button class="btn ghost" onclick="doPreview()">预览</button>
    <button class="btn ghost" onclick="openBuildDialog()">构建</button>
  </div>
</div>

<div class="drawer-backdrop" id="drawerBackdrop" onclick="closeDrawer()"></div>
<nav class="drawer" id="drawer">
  <div class="drawer-head" style="display:flex;align-items:center;justify-content:space-between">mssg
    <button class="btn ghost" style="padding:6px 12px" onclick="closeDrawer()">✕</button>
  </div>
  <button class="drawer-item" onclick="closeDrawer();openAiBuild()">✨ AI 建站</button>
  <div class="drawer-sec">内容</div>
  <button class="drawer-item" onclick="closeDrawer();openEditor()">✏️ 新建文章</button>
  <div class="drawer-sec">构建</div>
  <button class="drawer-item" onclick="closeDrawer();doBuild()">🔨 构建站点</button>
  <button class="drawer-item" onclick="closeDrawer();doPreview()">👁 预览站点</button>
  <button class="drawer-item" onclick="closeDrawer();openFiles()">📁 构建项目</button>
  <button class="drawer-item" onclick="closeDrawer();doCleanBuild()">🧹 清除构建产物</button>
  <div class="drawer-sec">发布</div>
  <button class="drawer-item" onclick="closeDrawer();openExport()">📦 导出 ZIP</button>
  <button class="drawer-item" onclick="closeDrawer();openCf()">☁️ 部署到 Cloudflare Pages</button>
  <button class="drawer-item" onclick="closeDrawer();doBackupSite()">🗄️ 备份站点源码</button>
  <button class="drawer-item" onclick="closeDrawer();pickBackup()">📥 从备份恢复</button>
  <div class="drawer-sec">设置</div>
  <button class="drawer-item" onclick="toggleTheme()">🌙 深色模式<small id="themeLabel"></small></button>
  <button class="drawer-item" onclick="closeDrawer();openThemes()">🎨 主题</button>
  <button class="drawer-item" onclick="closeDrawer();openPlugins()">🧩 扩展商店</button>
  <button class="drawer-item" onclick="closeDrawer();checkUpdate(true)">🔄 检查更新<small id="verLabelD"></small></button>
</nav>

<div class="list" id="list"></div>

<button class="fab" onclick="openEditor()" aria-label="新建">＋</button>

<div class="editor" id="editor">
  <div class="editor-bar">
    <button class="btn ghost" onclick="closeEditor()">‹ 返回</button>
    <h2 id="editorTitle">新建文章</h2>
    <button class="btn ghost" onclick="doSharePage()">分享</button>
    <button class="btn ghost" onclick="doSave()">保存</button>
  </div>
  <div class="editor-body">
    <div class="field">
      <label>标题</label>
      <input type="text" id="f_title" placeholder="文章标题">
    </div>
    <div class="row2">
      <div class="field">
        <label>文件名（content/ 下相对路径）</label>
        <input type="text" id="f_rel" placeholder="post/hello.md">
      </div>
      <div class="field">
        <label>日期</label>
        <input type="date" id="f_date">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>标签（逗号分隔）</label>
        <input type="text" id="f_tags" placeholder="生活, 随笔">
      </div>
      <div class="field">
        <label>分类（逗号分隔）</label>
        <input type="text" id="f_categories" placeholder="">
      </div>
    </div>
    <div class="field">
      <label class="check"><input type="checkbox" id="f_draft"> 草稿（不发布）</label>
    </div>
    <div class="field">
      <label>正文（Markdown）</label>
      <div class="mdbar">
        <button type="button" onclick="mdLinePrefix('## ')" title="标题">H</button>
        <button type="button" onclick="mdWrap('**','**','加粗')" title="加粗">B</button>
        <button type="button" onclick="mdWrap('*','*','斜体')" title="斜体"><i>I</i></button>
        <button type="button" onclick="mdLink()" title="链接">🔗</button>
        <button type="button" onclick="mdImageUrl()" title="图片链接">🖼️</button>
        <button type="button" onclick="pickImage()" title="从相册插入">📷</button>
        <button type="button" onclick="mdLinePrefix('- ')" title="列表">☰</button>
        <button type="button" onclick="mdLinePrefix('> ')" title="引用">❝</button>
        <button type="button" onclick="mdWrap('`','`','代码')" title="行内代码">‹›</button>
        <button type="button" onclick="openAi()" title="AI 写作助手">🤖</button>
      </div>
      <textarea id="f_body" placeholder="# 标题&#10;&#10;正文…"></textarea>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="loading" id="loading"><div class="spinner"></div><div>处理中…</div></div>

<div class="editor" id="cssEditor">
  <div class="editor-bar">
    <button class="btn ghost" onclick="closeCssEditor()">‹ 返回</button>
    <h2>自定义 CSS</h2>
    <button class="btn ghost" onclick="clearCss()">恢复默认</button>
    <button class="btn ghost" onclick="saveCss()">应用</button>
  </div>
  <div class="editor-body">
    <div class="field">
      <label id="cssHint">在当前主题样式基础上改，点"应用"实时生效</label>
      <textarea id="f_css" style="min-height:60vh" spellcheck="false"></textarea>
    </div>
  </div>
</div>

<div class="sheet-backdrop" id="themeSheet" onclick="if(event.target===this)closeThemes()">
  <div class="sheet">
    <h3>选择主题</h3>
    <div id="themeList"></div>
    <button class="theme-opt" onclick="closeThemes();openCssEditor()">
      <span>✏️</span><span>自定义 CSS<span id="cssBadge"></span><br><small style="color:var(--muted)">随意改样式，实时预览</small></span>
    </button>
  </div>
</div>

<div class="sheet-backdrop" id="exportSheet" onclick="if(event.target===this)closeExport()">
  <div class="sheet">
    <h3>导出 ZIP</h3>
    <div id="buildInfo" style="font-size:13px;color:var(--muted);margin:0 4px 8px"></div>
    <button class="theme-opt" onclick="doExportZip(true)">
      <span>💾</span><span>保存 ZIP 到下载<br><small style="color:var(--muted)">用于上传到 Cloudflare Pages / Netlify</small></span>
    </button>
    <button class="theme-opt" onclick="doExportZip(false)">
      <span>📤</span><span>分享 ZIP<br><small style="color:var(--muted)">通过微信 / 邮件 / 云盘发送</small></span>
    </button>
    <div style="font-size:13px;color:var(--muted);margin:0 4px 8px">更多操作（部署、备份、构建文件、检查更新）已移到左上角 ☰ 菜单</div>
  </div>
</div>

<div class="sheet-backdrop" id="aiBuildSheet" onclick="if(event.target===this)closeAiBuild()">
  <div class="sheet" style="max-height:86vh;display:flex;flex-direction:column">
    <h3>✨ AI 建站</h3>
    <div class="field"><label>一句话描述你想要的网站</label>
      <textarea id="aiBuildDesc" rows="3" placeholder="比如：一个摄影作品集网站，深色风格，有首页、作品、关于我"></textarea>
    </div>
    <div class="field"><label>主题</label>
      <select id="aiBuildTheme">
        <option value="auto">让 AI 选</option>
        <option value="minimal">minimal（简约）</option>
        <option value="company">company（公司站）</option>
      </select>
    </div>
    <button class="btn" onclick="runAiBuild()" style="margin-bottom:8px">🚀 生成网站</button>
    <div id="aiBuildResult" style="display:none">
      <div class="field"><label>结果</label>
        <div id="aiBuildMsg" style="font-size:15px;margin-bottom:10px"></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
        <button class="btn sm" onclick="aiPreview()">👁 预览</button>
        <button class="btn sm" onclick="aiPromote()">设为我的站点</button>
      </div>
    </div>
    <button class="btn ghost" onclick="closeAiBuild()">关闭</button>
  </div>
</div>

<div class="sheet-backdrop" id="aiSheet" onclick="if(event.target===this)closeAi()">
  <div class="sheet" style="max-height:86vh;display:flex;flex-direction:column">
    <h3>🤖 AI 写作助手</h3>
    <div id="aiActions" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px"></div>
    <div id="aiResultWrap" style="display:none;margin-bottom:10px">
      <div class="field"><label>结果</label>
        <div id="aiResult" style="border:1px solid var(--input-border);background:var(--card);border-radius:12px;padding:12px 14px;max-height:30vh;overflow-y:auto;white-space:pre-wrap;font-size:15px"></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn sm" onclick="aiInsert()">插入到光标</button>
        <button class="btn sm" onclick="aiReplace()">替换全文</button>
        <button class="btn ghost sm" onclick="aiCopy()">复制</button>
      </div>
    </div>
    <div class="drawer-sec">接口设置 <small style="color:var(--muted)">兼容 OpenAI 格式</small></div>
    <div class="field"><label>API 地址</label><input type="text" id="ai_endpoint" placeholder="https://api.deepseek.com/v1"></div>
    <div class="field"><label>API Key</label><input type="password" id="ai_key" placeholder="sk-…"></div>
    <div class="field"><label>模型</label><input type="text" id="ai_model" placeholder="deepseek-chat"></div>
    <button class="btn" onclick="saveAiSettings()" style="margin-bottom:8px">保存设置</button>
    <button class="btn ghost" onclick="closeAi()">关闭</button>
  </div>
</div>

<div class="sheet-backdrop" id="pluginSheet" onclick="if(event.target===this)closePlugins()">
  <div class="sheet" style="max-height:82vh;display:flex;flex-direction:column">
    <h3>🧩 扩展商店</h3>
    <div class="drawer-sec">已安装</div>
    <div id="pluginInstalled" style="margin-bottom:6px"></div>
    <div class="drawer-sec">可安装 <small style="color:var(--muted)">mssg-plugins 仓库</small></div>
    <div id="pluginAvailable" style="overflow-y:auto;margin:0 -4px 8px"></div>
    <button class="btn ghost" onclick="closePlugins()">关闭</button>
  </div>
</div>

<div class="sheet-backdrop" id="buildSheet" onclick="if(event.target===this)closeBuildDialog()">
  <div class="sheet">
    <h3>构建为项目</h3>
    <div class="field"><label>项目名称</label>
      <input type="text" id="buildName" placeholder="比如：我的博客 v1">
    </div>
    <div id="buildExisting" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px"></div>
    <div style="display:flex;gap:8px">
      <button class="btn" onclick="doBuildProject()" style="flex:1">🚀 构建</button>
      <button class="btn ghost" onclick="closeBuildDialog()">取消</button>
    </div>
    <div style="font-size:13px;color:var(--muted);margin-top:10px">用已有的名字会覆盖该项目（会二次确认）；新名字则新建项目。</div>
  </div>
</div>

<div class="sheet-backdrop" id="filesSheet" onclick="if(event.target===this)closeFiles()">
  <div class="sheet" style="max-height:82vh;display:flex;flex-direction:column">
    <h3 id="filesTitle">构建项目 <small id="filesTotal" style="color:var(--muted);font-weight:400"></small></h3>
    <div id="filesList" style="overflow-y:auto;margin:0 -4px 8px"></div>
    <button class="btn ghost" onclick="closeFiles()">关闭</button>
  </div>
</div>

<div class="sheet-backdrop" id="updateSheet" onclick="if(event.target===this)closeUpdate()">
  <div class="sheet">
    <h3>🔄 发现新版本 <span id="updVer"></span></h3>
    <div id="updBody" style="font-size:14px;color:var(--muted);white-space:pre-wrap;max-height:30vh;overflow-y:auto;margin-bottom:12px"></div>
    <button class="theme-opt" onclick="doUpdateDownload()">
      <span>⬇️</span><span>下载并安装<br><small style="color:var(--muted)">应用内下载，完成后自动调起安装</small></span>
    </button>
    <button class="btn ghost" id="updLater" onclick="closeUpdate()">稍后</button>
  </div>
</div>

<div class="sheet-backdrop" id="cfSheet" onclick="if(event.target===this)closeCf()">
  <div class="sheet">
    <h3>☁️ Cloudflare Pages</h3>
    <div id="cfBody"></div>
  </div>
</div>

<script>
"use strict";
function openDrawer(){ $("drawer").classList.add("open"); $("drawerBackdrop").classList.add("show"); }
function closeDrawer(){ $("drawer").classList.remove("open"); $("drawerBackdrop").classList.remove("show"); }
setTimeout(()=>{
  try{
    const v = "当前版本 v" + bridge().getAppVersion();
    const a = $("verLabel"); if(a) a.textContent = v;
    const b = $("verLabelD"); if(b) b.textContent = v;
  }catch(e){}
}, 500);
setTimeout(()=>checkUpdate(false), 3500);

/* Markdown 工具栏 */
function mdArea(){ return $("f_body"); }
function mdInsert(text){
  const ta = mdArea();
  const s = ta.selectionStart, e = ta.selectionEnd;
  ta.value = ta.value.slice(0, s) + text + ta.value.slice(e);
  ta.selectionStart = ta.selectionEnd = s + text.length;
  ta.focus();
}
function mdWrap(before, after, placeholder){
  const ta = mdArea();
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.slice(s, e) || placeholder;
  ta.value = ta.value.slice(0, s) + before + sel + after + ta.value.slice(e);
  ta.selectionStart = s + before.length;
  ta.selectionEnd = s + before.length + sel.length;
  ta.focus();
}
function mdLinePrefix(prefix){
  // 当前行行首加前缀（已有则去掉）
  const ta = mdArea();
  const s = ta.selectionStart, v = ta.value;
  const ls = v.lastIndexOf("\n", s - 1) + 1;
  let le = v.indexOf("\n", s); if(le === -1) le = v.length;
  const line = v.slice(ls, le);
  let nline, delta;
  if(line.startsWith(prefix)){ nline = line.slice(prefix.length); delta = -prefix.length; }
  else { nline = prefix + line; delta = prefix.length; }
  ta.value = v.slice(0, ls) + nline + v.slice(le);
  ta.selectionStart = ta.selectionEnd = Math.max(ls, s + delta);
  ta.focus();
}
function mdLink(){
  const ta = mdArea();
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.slice(s, e) || "链接文字";
  const ins = "[" + sel + "]()";
  ta.value = ta.value.slice(0, s) + ins + ta.value.slice(e);
  ta.selectionStart = ta.selectionEnd = s + ins.length - 1; // 光标进括号填 URL
  ta.focus();
}
function mdImageUrl(){
  mdInsert("![图片]()");
  const ta = mdArea();
  ta.selectionStart = ta.selectionEnd = ta.selectionStart - 1; // 光标进括号填 URL
  ta.focus();
}

function slugify(s){
  const slug = (s || "").trim().toLowerCase()
    .replace(/[\s_]+/g, "-").replace(/[^\w\u4e00-\u9fff-]+/g, "")
    .replace(/-+/g, "-").replace(/^-|-$/g, "");
  return slug || ("post-" + Date.now().toString(36));
}

function extractJson(text){
  let t = String(text || "").trim();
  const m = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  if(m) t = m[1].trim();
  const i = t.indexOf("{"), j = t.lastIndexOf("}");
  if(i >= 0 && j > i) t = t.slice(i, j + 1);
  return t;
}

let PENDING_AI_PLUGIN = null;
function installPluginTyped(name, file, ptype){
  if(!/^[A-Za-z0-9_-]{1,64}$/.test(name) || !file || file.includes("..")){
    toast("插件信息非法"); return;
  }
  const tag = ptype === "ai" ? "aifile" : "pluginfile";
  if(ptype === "ai") PENDING_AI_PLUGIN = {name: name};
  else PENDING_PLUGIN = {name: name};
  toast("正在下载 " + name + "…");
  try{ bridge().fetchText(tag, PLUGINS_BASE + file); }
  catch(e){
    if(ptype === "ai") PENDING_AI_PLUGIN = null; else PENDING_PLUGIN = null;
    toast("下载失败：" + e);
  }
}

  if(!r || r.error || r.status !== 200){ toast("下载失败：" + ((r && (r.error || ("HTTP " + r.status))) || "未知错误")); return; }
  const body = r.body || "";
  if(!body.trim()){ toast("插件文件为空"); return; }

/* 检查更新 */
let UPD_URL = "";
function cmpVer(a, b){
  const pa = a.split(".").map(x=>parseInt(x)||0), pb = b.split(".").map(x=>parseInt(x)||0);
  for(let i=0;i<Math.max(pa.length,pb.length);i++){
    const d = (pa[i]||0) - (pb[i]||0);
    if(d) return d;
  }
  return 0;
}
let UPD_MANUAL = false, UPD_WAITING = false;
const UPDATE_JSON_URL =
  "https://raw.githubusercontent.com/fghijkln/mssg-android/master/update.json";
function checkUpdate(manual){
  // 数据源：仓库内 update.json（GitHub API 对匿名请求 /releases/* 经常 404，不可靠）
  UPD_MANUAL = manual; UPD_WAITING = true;
  loading(true);
  setTimeout(()=>{
    if(UPD_WAITING){ UPD_WAITING = false; loading(false); if(UPD_MANUAL) toast("检查超时"); }
  }, 30000);
  try{ bridge().fetchText("update", UPDATE_JSON_URL); }
  catch(e){ UPD_WAITING = false; loading(false); if(manual) toast("检查失败："+e); }
}
function onFetchText(tag, raw){
  if(tag === "plugins"){ onPluginsFetched(raw); return; }
  if(tag === "pluginfile"){ onPluginFileFetched(raw); return; }
  if(tag === "ai"){ onAiResult(raw); return; }
  if(tag === "aibuild"){ onAiBuildResult(raw); return; }
  if(tag === "aifile"){ onAiFileFetched(raw); return; }
  if(tag !== "update" || !UPD_WAITING) return;
  UPD_WAITING = false; loading(false);
  const manual = UPD_MANUAL;
  let r;
  try{ r = JSON.parse(raw); }catch(e){ if(manual) toast("解析失败"); return; }
  if(!r || r.error || r.status !== 200){
    if(manual) toast("检查失败：" + ((r && (r.error || ("HTTP " + r.status))) || "未知错误"));
    return;
  }
  let j;
  try{ j = JSON.parse(r.body); }catch(e){ if(manual) toast("解析失败"); return; }
  const latest = String(j.latest || "").replace(/^v/, "");
  if(!latest){ if(manual) toast("没取到版本信息"); return; }
  let cur = "";
  try{ cur = bridge().getAppVersion(); }catch(e){}
  if(cmpVer(latest, cur) > 0){
    UPD_URL = j.apk ||
      ("https://github.com/fghijkln/mssg-android/releases/tag/v" + latest);
    $("updVer").textContent = "v" + latest;
    $("updBody").textContent = String(j.notes || "（无更新说明）").slice(0, 1200);
    $("updateSheet").classList.add("show");
  }else if(manual){
    toast("已是最新版本（v" + cur + "）");
  }
}
function closeUpdate(){ $("updateSheet").classList.remove("show"); }
function doUpdateDownload(){
  if(!UPD_URL) return;
  closeUpdate();
  try{ bridge().downloadUpdate(UPD_URL); }
  catch(e){ toast("下载失败：" + e); }
}

    if(!list.length){ box.innerHTML = '<p style="color:var(--muted);font-size:13px">还没有项目，在下面创建一个。</p>'; return; }
    box.innerHTML = list.map(p=>{
      const cur = (p.name===r.current) ? ' <small style="color:var(--acc)">● 当前</small>' : "";
      return '<button class="theme-opt" onclick="doCfUseProject(\''+p.name.replace(/\\/g,"\\\\").replace(/\'/g,"\\\'")+'\')">'+
        '<span>📄</span><span style="text-align:left;flex:1">'+cfEsc(p.name)+cur+
        '<br><small style="color:var(--muted)">'+cfEsc(p.url)+' · '+cfStatusBadge(p.latest)+'</small></span></button>';
    }).join("");
  });
}
function doCfUseProject(name){
  withLoading(()=>{
    const r = cfCall("cfSetProject", name);
    if(!r.ok){ toast(r.msg, 3200); return; }
    cfView = "deploy";
    toast("已切换到项目："+name, 2200);
    renderCf();
  });
}
function doCfConnect(){
  const token = $("cfToken").value.trim();
  if(!token){ toast("请先粘贴 API Token"); return; }
  withLoading(()=>{
    const r = cfCall("cfConnect", token);
    toast(r.ok ? ("已连接："+r.account_name) : r.msg, 3000);
    renderCf();
  });
}
function doCfSetAccount(){
  const id = $("cfAccountId").value.trim();
  if(!id){ toast("请先粘贴 Account ID"); return; }
  withLoading(()=>{
    const r = cfCall("cfSetAccount", id);
    toast(r.ok ? "账号已设置" : r.msg, 3200);
    renderCf();
  });
}
function doCfSetProject(){
  const name = $("cfProject").value.trim() || "mssg-site";
  withLoading(()=>{
    const r = cfCall("cfSetProject", name);
    if(!r.ok){ toast(r.msg, 3200); return; }
    cfView = "deploy";
    toast("项目就绪："+r.url, 3200);
    renderCf();
  });
}
function doCfDeploy(){
  withLoading(()=>{
    const r = cfCall("cfDeploy");
    if(!r.ok){ toast(r.msg, 4000); return; }
    $("cfBody").innerHTML =
      '<p style="font-size:15px">🎉 部署成功！</p>'+
      '<p><a href="'+r.project_url+'" target="_blank" style="color:var(--acc)">'+r.project_url+'</a></p>'+
      '<button class="theme-opt" onclick="closeCf()"><span>✅</span><span>完成</span></button>';
    toast("已上线", 2600);
  });
}
function doCfDisconnect(){
  const r = cfCall("cfDisconnect");
  toast(r.ok ? "已断开" : r.msg);
  renderCf();
}
function doSharePage(){
  const rel = $("f_rel").value.trim();
  if(!rel){ toast("没有可分享的页面"); return; }
  withLoading(()=>{
    let r;
    try{ r = JSON.parse(bridge().exportPageHtml(rel)); }
    catch(e){ toast("导出失败："+e); return; }
    if(!r.ok){ toast(r.msg); return; }
    bridge().shareFile(r.path, r.name || "page.html", "text/html");
    toast("正在打开分享…");
  });
}

/* 自定义 CSS */
function openCssEditor(){
  let r;
  try{ r = JSON.parse(bridge().getCustomCss()); }
  catch(e){ toast("读取失败："+e); return; }
  if(!r.ok){ toast(r.msg); return; }
  $("f_css").value = r.css || "";
  $("cssHint").textContent = r.is_custom
    ? "正在覆盖主题样式，点“应用”实时生效"
    : "以当前主题样式为起点改，点“应用”实时生效";
  $("cssEditor").classList.add("open");
}
function closeCssEditor(){ $("cssEditor").classList.remove("open"); }
function saveCss(){
  withLoading(()=>{
    let r;
    try{ r = JSON.parse(bridge().saveCustomCss($("f_css").value)); }
    catch(e){ toast("应用失败："+e); return; }
    toast(r.ok ? ("已应用，" + (r.msg||"")) : r.msg);
  });
}
function clearCss(){
  if(!confirm("清除自定义 CSS，恢复主题默认样式？")) return;
  withLoading(()=>{
    let r;
    try{ r = JSON.parse(bridge().clearCustomCss()); }
    catch(e){ toast("清除失败："+e); return; }
    if(r.ok){ toast("已恢复默认"); openCssEditor(); }
    else toast(r.msg);
  });
}

document.addEventListener("DOMContentLoaded", refresh);
</script>
</body>
</html>
