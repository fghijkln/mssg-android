apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

android {
    namespace 'com.mssg.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.mssg.app"
        minSdk 24
        targetSdk 34
        // 版本号由 CI 从 git tag 自动传入（-PappVersionName/-PappVersionCode），
        // 本地构建/F-Droid 构建时回退到下面的手写值。发版时记得同步改这里，
        // 否则 F-Droid 打出的包版本号是错的。
        def verCode = (project.findProperty("appVersionCode") ?: "90") as int
        def verName = project.findProperty("appVersionName") ?: "0.27.6"
        versionCode verCode
        versionName verName

        ndk {
            // 只留 arm64；x86_64（模拟器）/armeabi-v7a（32 位）已砍
            abiFilters "arm64-v8a"
        }

        python {
            version "3.11"
            pip {
                install "Markdown>=3.7"
                install "Jinja2>=3.1"
                install "Pillow>=10.0"
                install "Pygments>=2.18"
            }
        }
    }

    buildFeatures {
        // AGP 8+ 默认关闭 BuildConfig；flavor 开关（SELF_UPDATE_ENABLED）需要它
        buildConfig true
    }

    // 发行渠道：github（自带更新器）/ fdroid（F-Droid 政策不允许应用内自更新）
    flavorDimensions "dist"
    productFlavors {
        github {
            dimension "dist"
            buildConfigField "boolean", "SELF_UPDATE_ENABLED", "true"
        }
        fdroid {
            dimension "dist"
            buildConfigField "boolean", "SELF_UPDATE_ENABLED", "false"
        }
    }

    signingConfigs {
        release {
            // CI 从 Secrets 注入；本地构建没有这些环境变量时用 debug 签名代替
            def ksPath = System.getenv("MSSG_KEYSTORE_PATH")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("MSSG_KEYSTORE_PASSWORD")
                keyAlias System.getenv("MSSG_KEY_ALIAS")
                keyPassword System.getenv("MSSG_KEY_PASSWORD")
            } else {
                initWith signingConfigs.debug
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
