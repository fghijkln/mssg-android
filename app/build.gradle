apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

android {
    namespace 'com.mssg.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.mssg.app"
        minSdk 24
        targetSdk 34
        // 版本号手写在这里（发版时同步改）；CI 会校验 versionName 与 git tag 一致，
        // 不一致则构建失败。F-Droid 直接用这里的值构建。
        versionCode 98
        versionName "0.27.7"

        ndk {
            // 只留 arm64；x86_64（模拟器）/armeabi-v7a（32 位）已砍
            abiFilters "arm64-v8a"
        }

        python {
            version "3.11"
            pip {
                install "Markdown>=3.7"
                install "Jinja2>=3.1"
                install "Pillow>=10.0"
                install "Pygments>=2.18"
            }
        }
    }

    buildFeatures {
        // AGP 8+ 默认关闭 BuildConfig；flavor 开关（SELF_UPDATE_ENABLED）需要它
        buildConfig true
    }

    // 发行渠道：github（自带更新器）/ fdroid（F-Droid 政策不允许应用内自更新）
    flavorDimensions "dist"
    productFlavors {
        github {
            dimension "dist"
            buildConfigField "boolean", "SELF_UPDATE_ENABLED", "true"
        }
        fdroid {
            dimension "dist"
            buildConfigField "boolean", "SELF_UPDATE_ENABLED", "false"
        }
    }

    signingConfigs {
        release {
            // CI 从 Secrets 注入；本地构建没有这些环境变量时用 debug 签名代替
            def ksPath = System.getenv("MSSG_KEYSTORE_PATH")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("MSSG_KEYSTORE_PASSWORD")
                keyAlias System.getenv("MSSG_KEY_ALIAS")
                keyPassword System.getenv("MSSG_KEY_PASSWORD")
            } else {
                initWith signingConfigs.debug
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
