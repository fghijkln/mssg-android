apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

android {
    namespace 'com.mssg.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.mssg.app"
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName "0.18.0"

        ndk {
            // 主流手机全覆盖；x86_64 供模拟器用
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }

        python {
            version "3.11"
            pip {
                install "Markdown>=3.7"
                install "Jinja2>=3.1"
                install "Pillow>=10.0"
                install "Pygments>=2.18"
            }
        }
    }

    signingConfigs {
        release {
            // CI 从 Secrets 注入；本地构建没有这些环境变量时用 debug 签名代替
            def ksPath = System.getenv("MSSG_KEYSTORE_PATH")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("MSSG_KEYSTORE_PASSWORD")
                keyAlias System.getenv("MSSG_KEY_ALIAS")
                keyPassword System.getenv("MSSG_KEY_PASSWORD")
            } else {
                initWith signingConfigs.debug
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
