apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

android {
    namespace 'com.mssg.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.mssg.app"
        minSdk 24
        targetSdk 34
        // 版本号由 CI 从 git tag 自动传入（-PappVersionName/-PappVersionCode），
        // 本地构建时回退到下面的手写值。以后发版不用再手动改这里。
        versionCode (project.findProperty("appVersionCode") ?: 37) as int
        versionName project.findProperty("appVersionName") ?: "0.27.0"

        ndk {
            // 只留 arm64；x86_64（模拟器）/armeabi-v7a（32 位）已砍
            abiFilters "arm64-v8a"
        }

        python {
            version "3.11"
            pip {
                install "Markdown>=3.7"
                install "Jinja2>=3.1"
                install "Pillow>=10.0"
                install "Pygments>=2.18"
            }
        }
    }

    signingConfigs {
        release {
            // CI 从 Secrets 注入；本地构建没有这些环境变量时用 debug 签名代替
            def ksPath = System.getenv("MSSG_KEYSTORE_PATH")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("MSSG_KEYSTORE_PASSWORD")
                keyAlias System.getenv("MSSG_KEY_ALIAS")
                keyPassword System.getenv("MSSG_KEY_PASSWORD")
            } else {
                initWith signingConfigs.debug
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
